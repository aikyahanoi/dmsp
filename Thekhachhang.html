<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#142B45">

<title>Lịch sử lấy hàng | AIKYA</title>

<style>
/* =====================================================
   1. HỆ THỐNG MÀU SẮC: NAVY - CHAMPAGNE GOLD - IVORY
===================================================== */
:root {
  --navy: #142B45;
  --navy-light: #203D5C;
  --navy-deep: #0E2035;

  --gold: #C6A15B;
  --gold-light: #E5D2A6;
  --gold-pale: #F5EDDA;

  --ivory: #F7F5F0;
  --white: #FFFFFF;
  --ink: #263746;
  --muted: #7B7B75;
  --line: #E5DED1;
  --row-alt: #FAF8F3;

  --success: #198568;
  --danger: #C74747;

  --shadow: 0 8px 28px rgba(20,43,69,.08);
  --shadow-hover: 0 12px 30px rgba(20,43,69,.12);
  --radius: 16px;
}

/* =====================================================
   2. RESET VÀ NỀN TRANG
===================================================== */
* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
               Arial, sans-serif;
  background: var(--ivory);
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

button:focus-visible,
input:focus-visible {
  outline: 3px solid rgba(198,161,91,.4);
  outline-offset: 2px;
}

.hidden {
  display: none !important;
}

.top,
main {
  width: min(1280px, 100%);
  margin-inline: auto;
}

/* =====================================================
   3. ĐẦU TRANG
===================================================== */
.top {
  padding: 20px 18px 18px;
}

.top-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 18px 22px;
  background: linear-gradient(
    120deg,
    var(--navy-deep),
    var(--navy),
    var(--navy-light)
  );
  border: 1px solid rgba(198,161,91,.55);
  border-radius: 18px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}

.top-inner::after {
  content: "";
  position: absolute;
  right: -50px;
  top: -100px;
  width: 240px;
  height: 240px;
  border: 1px solid rgba(198,161,91,.18);
  border-radius: 50%;
  pointer-events: none;
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
  position: relative;
  z-index: 1;
}

.logo {
  width: 54px;
  height: 54px;
  flex: 0 0 auto;
  object-fit: contain;
  padding: 5px;
  background: #FFFFFF;
  border: 1px solid var(--gold);
  border-radius: 13px;
}

h1 {
  margin: 0;
  color: #FFFFFF;
  font-size: clamp(21px, 2.5vw, 30px);
  line-height: 1.25;
  font-weight: 850;
  letter-spacing: -.45px;
}

.connection {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 0 0 auto;
  padding: 9px 13px;
  border: 1px solid rgba(229,210,166,.4);
  border-radius: 99px;
  background: rgba(255,255,255,.08);
  color: #F5EDDA;
  font-size: 11px;
  font-weight: 750;
  position: relative;
  z-index: 1;
}

.dot {
  width: 8px;
  height: 8px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: var(--gold);
}

.dot.ok {
  background: #55D6A6;
}

.dot.error {
  background: #FF7777;
}

/* =====================================================
   4. KHU VỰC NỘI DUNG
===================================================== */
main {
  padding: 0 18px 36px;
}

.glass {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* =====================================================
   5. BỘ LỌC
===================================================== */
.filters {
  padding: 18px;
  margin-bottom: 16px;
  border-top: 4px solid var(--gold);
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 15px;
}

.section-head h2,
.results-head h2,
.detail-head h2 {
  margin: 0;
  color: var(--navy);
  font-size: 16px;
  font-weight: 850;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 15px;
  border: 1px solid var(--gold);
  border-radius: 10px;
  background: var(--white);
  color: var(--navy);
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
  transition: background .18s ease, box-shadow .18s ease;
}

.btn:hover {
  background: var(--gold-pale);
  box-shadow: 0 3px 10px rgba(198,161,91,.15);
}

.rep-scroll {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  padding: 2px 1px 12px;
  margin-bottom: 8px;
  scrollbar-width: thin;
  scrollbar-color: var(--gold-light) transparent;
}

.rep-chip {
  flex: 0 0 auto;
  padding: 9px 14px;
  border: 1px solid var(--line);
  border-radius: 99px;
  background: var(--white);
  color: var(--navy);
  font-size: 12px;
  font-weight: 750;
  white-space: nowrap;
  transition: .18s ease;
}

.rep-chip:hover {
  border-color: var(--gold);
  background: var(--gold-pale);
}

.rep-chip.active {
  color: #FFFFFF;
  background: var(--navy);
  border-color: var(--gold);
  box-shadow: 0 4px 12px rgba(20,43,69,.15);
}

.search-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.field {
  min-width: 0;
}

.field label {
  display: block;
  margin: 0 0 7px 2px;
  color: var(--navy);
  font-size: 11px;
  font-weight: 850;
  letter-spacing: .3px;
}

.input-wrap {
  position: relative;
}

.search-icon {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--gold);
  font-size: 21px;
  pointer-events: none;
}

input {
  display: block;
  width: 100%;
  min-width: 0;
  height: 45px;
  padding: 0 12px 0 40px;
  border: 1px solid #D9D2C5;
  border-radius: 11px;
  outline: none;
  background: #FFFFFF;
  color: var(--ink);
  font-size: 14px;
  transition: border-color .18s ease, box-shadow .18s ease;
}

input::placeholder {
  color: #96948D;
}

input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(198,161,91,.14);
}

/* =====================================================
   6. BẢNG DANH SÁCH KHÁCH HÀNG
===================================================== */
.results {
  overflow: hidden;
  border-top: 4px solid var(--gold);
}

.results-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 17px 18px;
  border-bottom: 1px solid var(--line);
  background: #FFFFFF;
}

.results-head h2 {
  font-size: 17px;
}

.count {
  flex: 0 0 auto;
  padding: 8px 12px;
  border: 1px solid var(--gold-light);
  border-radius: 99px;
  background: var(--gold-pale);
  color: var(--navy);
  font-size: 11px;
  font-weight: 850;
}

.table-wrap {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  font-size: 12px;
}

.data-table th {
  padding: 13px 12px;
  color: #FFFFFF;
  background: var(--navy);
  border: 1px solid #314B64;
  text-align: left;
  font-size: 10px;
  font-weight: 850;
  line-height: 1.45;
  letter-spacing: .35px;
}

.data-table td {
  padding: 12px;
  color: var(--ink);
  background: #FFFFFF;
  border: 1px solid var(--line);
  vertical-align: middle;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.data-table tbody tr:nth-child(even) td {
  background: var(--row-alt);
}

.data-table tbody tr:hover td {
  background: #F3EBD9;
}

.data-table .name-cell {
  color: var(--navy);
  font-weight: 800;
}

.data-table .rep-cell {
  color: #596875;
}

.data-table .money-cell {
  color: var(--navy);
  text-align: right;
  font-weight: 850;
  font-variant-numeric: tabular-nums;
}

.data-table .number-cell {
  text-align: center;
  font-weight: 750;
  font-variant-numeric: tabular-nums;
}

.row-open {
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--navy);
  font: inherit;
  font-weight: 850;
  text-align: left;
  overflow-wrap: anywhere;
  cursor: pointer;
}

.row-open:hover {
  color: #9B7738;
  text-decoration: underline;
}

/* TỶ LỆ CỘT BẢNG KHÁCH HÀNG */
#resultsWrap .data-table th:nth-child(1),
#resultsWrap .data-table td:nth-child(1) {
  width: 44%;
}

#resultsWrap .data-table th:nth-child(2),
#resultsWrap .data-table td:nth-child(2) {
  width: 22%;
}

#resultsWrap .data-table th:nth-child(3),
#resultsWrap .data-table td:nth-child(3) {
  width: 12%;
}

#resultsWrap .data-table th:nth-child(4),
#resultsWrap .data-table td:nth-child(4) {
  width: 22%;
}

/* =====================================================
   7. CHI TIẾT KHÁCH HÀNG
===================================================== */
.detail {
  border-top: 4px solid var(--gold);
  margin-top: 16px;
  padding: 18px;
}

.detail-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}

.detail-head h2 {
  font-size: 20px;
  overflow-wrap: anywhere;
}

.detail-meta {
  margin-top: 7px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
}

.detail-total {
  margin-top: 10px;
  color: #9B7738;
  font-size: 15px;
  font-weight: 900;
}

.detail-table th:nth-child(1),
.detail-table td:nth-child(1) {
  width: 38%;
}

.detail-table th:nth-child(2),
.detail-table td:nth-child(2) {
  width: 15%;
}

.detail-table th:nth-child(3),
.detail-table td:nth-child(3) {
  width: 12%;
}

.detail-table th:nth-child(4),
.detail-table td:nth-child(4) {
  width: 16%;
}

.detail-table th:nth-child(5),
.detail-table td:nth-child(5) {
  width: 19%;
}

/* =====================================================
   8. TRẠNG THÁI TRỐNG VÀ LỖI
===================================================== */
.empty {
  padding: 34px 18px;
  color: var(--muted);
  text-align: center;
  font-size: 13px;
  line-height: 1.8;
}

.empty strong {
  color: var(--navy);
}

.empty .btn {
  margin-top: 12px;
}

.empty a {
  color: var(--navy);
}

/* =====================================================
   9. TỐI ƯU CHO MÁY TÍNH BẢNG VÀ ĐIỆN THOẠI
===================================================== */
@media (max-width: 640px) {
  .top {
    padding: 10px 8px 12px;
  }

  .top-inner {
    padding: 13px 11px;
    gap: 7px;
    border-radius: 14px;
  }

  .brand {
    gap: 9px;
  }

  .logo {
    width: 40px;
    height: 40px;
    padding: 3px;
    border-radius: 10px;
  }

  h1 {
    font-size: 17px;
    letter-spacing: -.2px;
  }

  .connection {
    gap: 5px;
    padding: 7px 8px;
    font-size: 9px;
  }

  .dot {
    width: 7px;
    height: 7px;
  }

  main {
    padding: 0 7px 28px;
  }

  .filters {
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 13px;
  }

  .section-head {
    margin-bottom: 11px;
  }

  .section-head h2 {
    font-size: 14px;
  }

  .btn {
    padding: 8px 10px;
    font-size: 10px;
  }

  .rep-scroll {
    gap: 6px;
    padding-bottom: 10px;
    margin-bottom: 5px;
  }

  .rep-chip {
    padding: 8px 11px;
    font-size: 10px;
  }

  .search-grid {
    grid-template-columns: minmax(0, 1fr);
    gap: 10px;
  }

  .field label {
    margin-bottom: 6px;
    font-size: 10px;
  }

  input {
    height: 41px;
    font-size: 13px;
  }

  .results-head {
    padding: 12px 10px;
    gap: 7px;
  }

  .results-head h2 {
    font-size: 14px;
  }

  .count {
    padding: 7px 8px;
    font-size: 9px;
  }

  .table-wrap {
    padding: 4px;
    overflow-x: hidden;
  }

  .data-table {
    display: table;
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
    font-size: 10px;
  }

  .data-table thead {
    display: table-header-group;
  }

  .data-table tbody {
    display: table-row-group;
  }

  .data-table thead tr,
  .data-table tbody tr {
    display: table-row;
    width: auto;
    margin: 0;
    border: 0;
    border-radius: 0;
    box-shadow: none;
  }

  .data-table th {
    display: table-cell;
    padding: 8px 3px;
    font-size: 9px;
    line-height: 1.3;
    overflow-wrap: anywhere;
    word-break: normal;
    letter-spacing: 0;
  }

  .data-table td,
  .data-table tbody td {
    display: table-cell;
    min-width: 0;
    padding: 8px 4px;
    border: 1px solid var(--line);
    font-size: 10px;
    line-height: 1.35;
    overflow-wrap: anywhere;
    word-break: normal;
    vertical-align: top;
  }

  .data-table tbody td::before {
    content: none;
    display: none;
  }

  /* BẢNG KHÁCH HÀNG TRÊN ĐIỆN THOẠI */
  #resultsWrap .data-table th:nth-child(1),
  #resultsWrap .data-table td:nth-child(1) {
    width: 43%;
  }

  #resultsWrap .data-table th:nth-child(2),
  #resultsWrap .data-table td:nth-child(2) {
    width: 15%;
  }

  #resultsWrap .data-table th:nth-child(3),
  #resultsWrap .data-table td:nth-child(3) {
    width: 12%;
  }

  #resultsWrap .data-table th:nth-child(4),
  #resultsWrap .data-table td:nth-child(4) {
    width: 30%;
  }

  .data-table .name-cell {
    background: #F3EBD9 !important;
    color: var(--navy);
    font-weight: 800;
  }

  .data-table .money-cell,
  .data-table .number-cell {
    text-align: right;
    white-space: normal;
    font-variant-numeric: tabular-nums;
  }

  .row-open {
    font-size: inherit;
    line-height: 1.35;
  }

  /* BẢNG CHI TIẾT SẢN PHẨM */
  .detail {
    padding: 11px;
    margin-top: 10px;
    border-radius: 13px;
  }

  .detail-head {
    gap: 7px;
    margin-bottom: 12px;
  }

  .detail-head h2 {
    font-size: 15px;
  }

  .detail-meta {
    font-size: 10px;
  }

  .detail-total {
    font-size: 12px;
  }

  .detail-table th:nth-child(1),
  .detail-table td:nth-child(1) {
    width: 36%;
  }

  .detail-table th:nth-child(2),
  .detail-table td:nth-child(2) {
    width: 17%;
  }

  .detail-table th:nth-child(3),
  .detail-table td:nth-child(3) {
    width: 12%;
  }

  .detail-table th:nth-child(4),
  .detail-table td:nth-child(4) {
    width: 16%;
  }

  .detail-table th:nth-child(5),
  .detail-table td:nth-child(5) {
    width: 19%;
  }

  .empty {
    padding: 25px 10px;
    font-size: 11px;

}

/* MÀN HÌNH RẤT NHỎ */
@media (max-width: 360px) {
  .top-inner {
    padding: 11px 8px;
  }

  .logo {
    width: 35px;
    height: 35px;
  }

  h1 {
    font-size: 15px;
  }

  .connection {
    padding: 6px;
    font-size: 8px;
  }

  .results-head h2 {
    font-size: 12px;
  }

  .count {
    font-size: 8px;
  }
}
</style>
</head>

<body>

<!-- ===================================================
     ĐẦU TRANG
=================================================== -->
<header class="top">
  <div class="top-inner">

    <div class="brand">
      <img
        class="logo"
        src="https://raw.githubusercontent.com/aikyahanoi/aikya-images/main/images/LOGO%20AIKYA%20-%20NEWEST.png"
        alt="AIKYA"
        onerror="this.style.display='none'"
      >

      <div>
        <h1>Lịch sử lấy hàng</h1>
      </div>
    </div>

    <div class="connection" role="status" aria-live="polite">
      <i class="dot" id="dot"></i>
      <span id="status">Đang kết nối</span>
    </div>

  </div>
</header>

<main>

  <!-- =================================================
       BỘ LỌC VÀ TÌM KIẾM
  ================================================== -->
  <section class="glass filters">

    <div class="section-head">
      <h2>Tìm kiếm và bộ lọc</h2>

      <button type="button" class="btn" id="reset">
        Đặt lại
      </button>
    </div>

    <div class="rep-scroll" id="repChips">
      <button
        type="button"
        class="rep-chip active"
        data-rep=""
      >Tất cả TDV</button>
    </div>

    <div class="search-grid">

      <div class="field">
        <label for="customerSearch">TÌM KHÁCH HÀNG</label>

        <div class="input-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>

          <input
            id="customerSearch"
            type="search"
            placeholder="Nhập tên khách hàng..."
            autocomplete="off"
          >
        </div>
      </div>

      <div class="field">
        <label for="productSearch">TÌM SẢN PHẨM</label>

        <div class="input-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>

          <input
            id="productSearch"
            type="search"
            placeholder="Nhập tên sản phẩm..."
            autocomplete="off"
          >
        </div>
      </div>

    </div>
  </section>

  <!-- =================================================
       DANH SÁCH KHÁCH HÀNG
  ================================================== -->
  <section class="glass results" id="resultsPanel">

    <div class="results-head">
      <h2 id="resultsTitle">Danh sách khách hàng</h2>

      <span class="count" id="resultsCount">Đang tải...</span>
    </div>

    <div id="resultsWrap" aria-live="polite">
      <div class="empty">Đang tải dữ liệu...</div>
    </div>

  </section>

  <!-- =================================================
       CHI TIẾT KHÁCH HÀNG
  ================================================== -->
  <section class="glass detail hidden" id="detailPanel">

    <div class="detail-head">

      <div>
        <h2 id="detailTitle">Chi tiết khách hàng</h2>
        <div class="detail-meta" id="detailMeta"></div>
        <div class="detail-total" id="detailTotal"></div>
      </div>

      <button type="button" class="btn" id="back">
        ← Quay lại
      </button>

    </div>

    <div id="productList"></div>

  </section>

</main>

<script>
"use strict";

/* =====================================================
   1. KẾT NỐI GOOGLE APPS SCRIPT
===================================================== */
const API_URL =
  "https://script.google.com/macros/s/AKfycbwWP7JLxEdO3qfZG850HZsoKB70fh4pUVrm3wsX4fPzAPCm1W2pcFrdVzZRrRvi8ycnNw/exec";

let rows = [];
let months = [];
let customers = [];
let selectedRep = "";
let selectedCustomer = null;

const $ = id => document.getElementById(id);

/* =====================================================
   2. HÀM XỬ LÝ DỮ LIỆU
===================================================== */
function norm(value) {
  return String(value ?? "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[đĐ]/g, "d")
    .toLowerCase()
    .trim();
}

function str(value) {
  return String(value ?? "").trim();
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function num(value) {
  if (typeof value === "number") {
    return Number.isFinite(value) ? value : 0;
  }

  let s = String(value ?? "").trim();

  if (!s) return 0;

  s = s.replace(/[₫đ\s]/gi, "");

  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) {
    s = s.replace(/\./g, "").replace(",", ".");
  } else if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) {
    s = s.replace(/,/g, "");
  } else if (s.includes(",") && !s.includes(".")) {
    s = s.replace(",", ".");
  } else {
    s = s.replace(/,/g, "");
  }

  const result = Number(s);

  return Number.isFinite(result) ? result : 0;
}

function money(value) {
  return Math.round(Number(value) || 0)
    .toLocaleString("vi-VN");
}

/* =====================================================
   3. TRẠNG THÁI KẾT NỐI
===================================================== */
function setStatus(message, state = "") {
  $("status").textContent = message;

  $("dot").className =
    "dot" + (state ? " " + state : "");
}

/* =====================================================
   4. TẢI DỮ LIỆU BẰNG JSONP
===================================================== */
function loadJSONP() {
  return new Promise((resolve, reject) => {

    const callbackName =
      "__aikyaCallback_" +
      Date.now() + "_" +
      Math.random().toString(36).slice(2);

    const script = document.createElement("script");

    const separator = API_URL.includes("?") ? "&" : "?";

    let finished = false;
    let timer;

    function cleanup() {
      clearTimeout(timer);

      script.onerror = null;
      script.remove();

      try {
        delete window[callbackName];
      } catch (_) {
        window[callbackName] = undefined;
      }
    }

    function finish(error, result) {
      if (finished) return;

      finished = true;
      cleanup();

      if (error) {
        reject(error);
        return;
      }

      if (
        !result ||
        result.success !== true ||
        !Array.isArray(result.data)
      ) {
        reject(new Error(
          result?.error ||
          "API không trả về dữ liệu hợp lệ."
        ));

        return;
      }

      resolve(result);
    }

    window[callbackName] = result => {
      finish(null, result);
    };

    script.onerror = () => {
      finish(new Error(
        "Không tải được dữ liệu từ API."
      ));
    };

    timer = setTimeout(() => {
      finish(new Error(
        "API phản hồi quá 20 giây. Vui lòng thử lại."
      ));
    }, 20000);

    script.src =
      API_URL +
      separator +
      "callback=" +
      encodeURIComponent(callbackName) +
      "&_=" +
      Date.now();

    document.head.appendChild(script);
  });
}

/* =====================================================
   5. KHỞI TẠO TRANG
===================================================== */
async function init() {
  setStatus("Đang tải");

  $("resultsCount").textContent = "Đang tải...";

  $("resultsWrap").innerHTML =
    '<div class="empty">Đang tải dữ liệu...</div>';

  try {
    const result = await loadJSONP();

    rows = result.data;

    const columns = Array.isArray(result.columns)
      ? result.columns
      : Object.keys(rows[0] || {});

    months = columns
      .filter(column =>
        /^\d{4}-T\d{2}$/i.test(String(column))
      )
      .sort();

    aggregate();

    setStatus("Đã kết nối", "ok");

    render();

  } catch (error) {
    console.error("AIKYA API error:", error);

    setStatus("Lỗi kết nối", "error");

    $("resultsCount").textContent = "Lỗi";

    $("resultsWrap").innerHTML = `
      <div class="empty">
        <strong>Không tải được dữ liệu.</strong>
        <br>
        ${esc(error.message || error)}
        <br>
        <button type="button" class="btn" id="retryLoad">
          Thử tải lại
        </button>
      </div>
    `;

    $("retryLoad").addEventListener("click", init);
  }
}

/* =====================================================
   6. GỘP DỮ LIỆU KHÁCH HÀNG VÀ SẢN PHẨM
===================================================== */
function aggregate() {
  const customerMap = new Map();

  rows.forEach(row => {

    const customerName = str(row["KHACH HANG"]);
    const rep = str(row["NVBH"]);
    const productName = str(row["SAN PHAM"]);

    if (!customerName || !productName) return;

    const customerKey =
      norm(customerName) + "||" + norm(rep);

    if (!customerMap.has(customerKey)) {
      customerMap.set(customerKey, {
        key: customerKey,
        customer: customerName,
        rep,
        total: 0,
        products: new Map()
      });
    }

    const customer = customerMap.get(customerKey);

    const productKey = norm(productName);

    if (!customer.products.has(productKey)) {
      customer.products.set(productKey, {
        name: productName,
        total: 0,
        months: {}
      });
    }

    const product = customer.products.get(productKey);

    const total = num(row["TONG"]);

    product.total += total;
    customer.total += total;

    months.forEach(month => {
      const amount = num(row[month]);

      if (amount > 0) {
        product.months[month] =
          (product.months[month] || 0) + amount;
      }
    });

  });

  customers = [...customerMap.values()].map(customer => {

    customer.products = [...customer.products.values()]
      .map(product => {

        const boughtMonths = months.filter(
          month => (product.months[month] || 0) > 0
        );

        const latest = boughtMonths.length
          ? boughtMonths[boughtMonths.length - 1]
          : "";

        return {
          ...product,
          monthCount: boughtMonths.length,
          latest,
          latestSales: latest
            ? product.months[latest]
            : 0
        };
      })
      .sort((a, b) =>
        a.name.localeCompare(b.name, "vi")
      );

    return customer;
  });

  renderRepChips();
}

/* =====================================================
   7. HIỂN THỊ DANH SÁCH TDV
===================================================== */
function renderRepChips() {
  const reps = [...new Set(
    customers.map(customer => customer.rep).filter(Boolean)
  )].sort((a, b) => a.localeCompare(b, "vi"));

  const options = [
    { name: "Tất cả TDV", value: "" },
    ...reps.map(rep => ({
      name: rep,
      value: rep
    }))
  ];

  $("repChips").innerHTML = options.map(rep => `
    <button
      type="button"
      class="rep-chip ${selectedRep === rep.value ? "active" : ""}"
      data-rep="${esc(rep.value)}"
    >${esc(rep.name)}</button>
  `).join("");

  $("repChips").querySelectorAll("[data-rep]").forEach(button => {

    button.addEventListener("click", () => {
      selectedRep = button.dataset.rep;
      selectedCustomer = null;

      syncReps();
      render();
    });

  });
}

function syncReps() {
  $("repChips")
    .querySelectorAll("[data-rep]")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.rep === selectedRep
      );

    });
}

/* =====================================================
   8. LỌC DỮ LIỆU
===================================================== */
function filteredCustomers() {
  const customerQuery = norm($("customerSearch").value);
  const productQuery = norm($("productSearch").value);

  return customers.map(customer => {

    if (
      selectedRep &&
      customer.rep !== selectedRep
    ) {
      return null;
    }

    if (
      customerQuery &&
      !norm(customer.customer).includes(customerQuery)
    ) {
      return null;
    }

    const matchingProducts = productQuery
      ? customer.products.filter(product =>
          norm(product.name).includes(productQuery)
        )
      : customer.products;

    if (
      productQuery &&
      matchingProducts.length === 0
    ) {
      return null;
    }

    return {
      ...customer,
      visibleProducts: matchingProducts,
      visibleTotal: productQuery
        ? matchingProducts.reduce(
            (sum, product) => sum + product.total,
            0
          )
        : customer.total
    };

  }).filter(Boolean);
}

/* =====================================================
   9. HIỂN THỊ DANH SÁCH KHÁCH HÀNG
===================================================== */
function render() {
  if (selectedCustomer) {
    renderDetail(selectedCustomer);
    return;
  }

  $("resultsPanel").classList.remove("hidden");
  $("detailPanel").classList.add("hidden");

  const list = filteredCustomers();

  const productQuery = norm($("productSearch").value);
  const customerQuery = norm($("customerSearch").value);

  list.sort((a, b) =>
    b.visibleTotal - a.visibleTotal
  );

  $("resultsTitle").textContent = productQuery
    ? "Khách hàng có sản phẩm phù hợp"
    : customerQuery
      ? "Kết quả tìm khách hàng"
      : "Danh sách khách hàng";

  $("resultsCount").textContent =
    list.length.toLocaleString("vi-VN") +
    " khách hàng";

  if (!list.length) {
    $("resultsWrap").innerHTML =
      '<div class="empty">Không tìm thấy kết quả phù hợp.</div>';

    return;
  }

  const body = list.map(customer => `
    <tr>
      <td class="name-cell">
        <button
          type="button"
          class="row-open"
          data-key="${esc(customer.key)}"
        >${esc(customer.customer)}</button>
      </td>

      <td class="rep-cell">
        ${esc(customer.rep || "—")}
      </td>

      <td class="number-cell">
        ${productQuery
          ? customer.visibleProducts.length
          : customer.products.length}
      </td>

      <td class="money-cell">
        ${money(customer.visibleTotal)}
      </td>
    </tr>
  `).join("");

  $("resultsWrap").innerHTML = `
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>TÊN KHÁCH HÀNG</th>
            <th>TDV</th>
            <th>SỐ SP</th>
            <th style="text-align:right">DSO TỔNG</th>
          </tr>
        </thead>

        <tbody>${body}</tbody>
      </table>
    </div>
  `;

  $("resultsWrap")
    .querySelectorAll("[data-key]")
    .forEach(button => {

      button.addEventListener("click", () => {
        openDetail(button.dataset.key);
      });

    });
}

/* =====================================================
   10. MỞ CHI TIẾT KHÁCH HÀNG
===================================================== */
function openDetail(key) {
  selectedCustomer =
    customers.find(customer => customer.key === key) || null;

  if (!selectedCustomer) return;

  renderDetail(selectedCustomer);

  window.scrollTo({
    top:
      $("detailPanel").getBoundingClientRect().top +
      window.scrollY - 8,
    behavior: "smooth"
  });
}

/* =====================================================
   11. HIỂN THỊ CHI TIẾT SẢN PHẨM
===================================================== */
function renderDetail(customer) {
  $("resultsPanel").classList.add("hidden");
  $("detailPanel").classList.remove("hidden");

  const productQuery = norm($("productSearch").value);

  const visibleProducts = (
    productQuery
      ? customer.products.filter(product =>
          norm(product.name).includes(productQuery)
        )
      : customer.products
  ).slice().sort((a, b) =>
    b.total - a.total ||
    a.name.localeCompare(b.name, "vi")
  );

  const visibleTotal = visibleProducts.reduce(
    (sum, product) => sum + product.total,
    0
  );

  $("detailTitle").textContent = customer.customer;

  $("detailMeta").textContent =
    "TDV: " + (customer.rep || "Chưa có") +
    " · " +
    visibleProducts.length +
    " sản phẩm";

  $("detailTotal").textContent =
    (productQuery
      ? "Doanh số sản phẩm khớp: "
      : "Doanh số tổng khách hàng: ") +
    money(productQuery ? visibleTotal : customer.total);

  if (!visibleProducts.length) {
    $("productList").innerHTML =
      '<div class="empty">Không tìm thấy sản phẩm phù hợp.</div>';

    return;
  }

  const body = visibleProducts.map(product => `
    <tr>
      <td class="name-cell">
        ${esc(product.name)}
      </td>

      <td class="money-cell">
        ${money(product.total)}
      </td>

      <td class="number-cell">
        ${product.monthCount}
      </td>

      <td class="number-cell">
        ${esc(product.latest || "—")}
      </td>

      <td class="money-cell">
        ${money(product.latestSales)}
      </td>
    </tr>
  `).join("");

  $("productList").innerHTML = `
    <div class="table-wrap">
      <table class="data-table detail-table">
        <thead>
          <tr>
            <th>SẢN PHẨM</th>
            <th>DSO TỔNG</th>
            <th>SỐ THÁNG LẤY</th>
            <th>THÁNG GẦN NHẤT</th>
            <th>DOANH SỐ THÁNG GẦN NHẤT</th>
          </tr>
        </thead>

        <tbody>${body}</tbody>
      </table>
    </div>
  `;
}

/* =====================================================
   12. ĐẶT LẠI BỘ LỌC
===================================================== */
function resetFilters() {
  selectedRep = "";
  selectedCustomer = null;

  $("customerSearch").value = "";
  $("productSearch").value = "";

  syncReps();
  render();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

/* =====================================================
   13. SỰ KIỆN GIAO DIỆN
===================================================== */
$("customerSearch").addEventListener("input", () => {
  selectedCustomer = null;
  render();
});

$("productSearch").addEventListener("input", () => {
  render();
});

$("reset").addEventListener("click", resetFilters);

$("back").addEventListener("click", () => {
  selectedCustomer = null;
  render();

  window.scrollTo({
    top:
      $("resultsPanel").getBoundingClientRect().top +
      window.scrollY - 8,
    behavior: "smooth"
  });
});

/* =====================================================
   14. CHẠY ỨNG DỤNG
===================================================== */
init();

</script>
