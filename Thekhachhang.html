<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#142B45">

<title>THẺ KHÁCH HÀNG AIKYA 2026</title>

<style>
:root {
  --navy: #142B45;
  --navy-light: #203D5C;
  --navy-deep: #0E2035;
  --gold: #C6A15B;
  --gold-light: #E5D2A6;
  --gold-pale: #F5EDDA;
  --ivory: #F7F5F0;
  --white: #FFFFFF;
  --ink: #263746;
  --muted: #7B7B75;
  --line: #E5DED1;
  --row-alt: #FAF8F3;
  --gray-zero: #E5E7EB;
  --success: #198568;
  --danger: #C74747;
  --shadow: 0 8px 28px rgba(20,43,69,.08);
  --radius: 16px;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: var(--ivory);
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

button:focus-visible,
input:focus-visible {
  outline: 3px solid rgba(198,161,91,.4);
  outline-offset: 2px;
}

.hidden {
  display: none !important;
}

.top,
main {
  width: min(1280px, 100%);
  margin-inline: auto;
}

/* =========================
   ĐẦU TRANG
========================= */

.top {
  padding: 20px 18px 18px;
}

.top-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 18px 22px;
  min-height: 150px;
  background-image: none; /* Halloween artwork removed */
  background-size: cover;
  background-position: center 48%;
  border: 1px solid rgba(198,161,91,.72);
  border-radius: 18px;
  box-shadow: 0 10px 30px rgba(12,26,45,.18);
  position: relative;
  overflow: hidden;
}

/* Halloween banner: desktop uses the themed artwork with its integrated branding. */
.top-inner .brand {
  display: none;
}

.top-inner::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(8,24,43,.05) 0%, transparent 42%, rgba(8,24,43,.16) 100%);
  pointer-events: none;
  z-index: 0;
}

.top-inner .connection {
  align-self: flex-end;
  margin-top: auto;
  background: rgba(9,27,47,.78);
  border-color: rgba(255,174,73,.58);
  color: #FFF2DE;
  backdrop-filter: blur(5px);
}

.top-inner::after {
  content: "";
  position: absolute;
  right: -50px;
  top: -100px;
  width: 240px;
  height: 240px;
  border: 1px solid rgba(198,161,91,.18);
  border-radius: 50%;
  pointer-events: none;
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
  position: relative;
  z-index: 1;
}

.logo {
  width: 54px;
  height: 54px;
  flex: 0 0 auto;
  object-fit: contain;
  padding: 5px;
  background: #FFFFFF;
  border: 1px solid var(--gold);
  border-radius: 13px;
}

h1 {
  margin: 0;
  color: #FFFFFF;
  font-size: clamp(21px, 2.5vw, 30px);
  line-height: 1.25;
  font-weight: 850;
  letter-spacing: -.45px;
}

.connection {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 0 0 auto;
  padding: 9px 13px;
  border: 1px solid rgba(229,210,166,.4);
  border-radius: 99px;
  background: rgba(255,255,255,.08);
  color: #F5EDDA;
  font-size: 11px;
  font-weight: 750;
  position: relative;
  z-index: 1;
}

.dot {
  width: 8px;
  height: 8px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: var(--gold);
}

.dot.ok {
  background: #55D6A6;
}

.dot.error {
  background: #FF7777;
}

/* =========================
   NỘI DUNG CHUNG
========================= */

main {
  padding: 0 18px 36px;
}

.glass {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* =========================
   BỘ LỌC
========================= */

.filters {
  padding: 14px 18px;
  margin-bottom: 10px;
  border-top: 4px solid var(--gold);
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 9px;
}

.section-head h2,
.results-head h2,
.detail-head h2 {
  margin: 0;
  color: var(--navy);
  font-size: 16px;
  font-weight: 850;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 15px;
  border: 1px solid var(--gold);
  border-radius: 10px;
  background: var(--white);
  color: var(--navy);
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
  transition: background .18s ease, box-shadow .18s ease;
}

.btn:hover {
  background: var(--gold-pale);
  box-shadow: 0 3px 10px rgba(198,161,91,.15);
}

.rep-scroll {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  padding: 2px 1px 7px;
  margin-bottom: 4px;
  scrollbar-width: thin;
  scrollbar-color: var(--gold-light) transparent;
}

.rep-chip {
  flex: 0 0 auto;
  padding: 9px 14px;
  border: 1px solid var(--line);
  border-radius: 99px;
  background: var(--white);
  color: var(--navy);
  font-size: 12px;
  font-weight: 750;
  white-space: nowrap;
  transition: .18s ease;
}

.rep-chip:hover {
  border-color: var(--gold);
  background: var(--gold-pale);
}

.rep-chip.active {
  color: #FFFFFF;
  background: var(--navy);
  border-color: var(--gold);
  box-shadow: 0 4px 12px rgba(20,43,69,.15);
}

.search-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.field {
  min-width: 0;
}

.field label {
  display: block;
  margin: 0 0 7px 2px;
  color: var(--navy);
  font-size: 11px;
  font-weight: 850;
  letter-spacing: .3px;
}

.input-wrap {
  position: relative;
}

.search-icon {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--gold);
  font-size: 21px;
  pointer-events: none;
}

input {
  display: block;
  width: 100%;
  min-width: 0;
  height: 45px;
  padding: 0 12px 0 40px;
  border: 1px solid #D9D2C5;
  border-radius: 11px;
  outline: none;
  background: #FFFFFF;
  color: var(--ink);
  font-size: 14px;
  transition: border-color .18s ease, box-shadow .18s ease;
}

input::placeholder {
  color: #96948D;
}

input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(198,161,91,.14);
}

/* =========================
   BẢNG KHÁCH HÀNG
========================= */

.results {
  overflow: visible;
  border-top: 4px solid var(--gold);
}

.results-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 17px 18px;
  border-bottom: 1px solid var(--line);
  background: #FFFFFF;
  position: sticky;
  top: 0;
  z-index: 20;
}

.results-head h2 {
  font-size: 17px;
}

.count {
  flex: 0 0 auto;
  padding: 8px 12px;
  border: 1px solid var(--gold-light);
  border-radius: 99px;
  background: var(--gold-pale);
  color: var(--navy);
  font-size: 11px;
  font-weight: 850;
}

.table-wrap {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  font-size: 12px;
}

.data-table th {
  padding: 10px 12px;
  color: #FFFFFF;
  background: var(--navy);
  border: 1px solid #314B64;
  text-align: left;
  font-size: 10px;
  font-weight: 850;
  line-height: 1.4;
  letter-spacing: .2px;
}
/* Danh sách khách hàng: để sticky hoạt động theo cuộn trang */
#resultsWrap > .table-wrap {
  overflow: visible;
}

#resultsWrap > .table-wrap > .data-table thead th {
  position: sticky;
  top: 72px;
  z-index: 15;
  text-align: center !important;
  vertical-align: middle !important;
  background: var(--navy);
}

.data-table td {
  padding: 9px 12px;
  color: var(--ink);
  background: #FFFFFF;
  border: 1px solid var(--line);
  vertical-align: middle;
  line-height: 1.35;
  overflow-wrap: anywhere;
}

.data-table tbody tr:nth-child(even) td {
  background: var(--row-alt);
}

.data-table tbody tr:hover td {
  background: #F3EBD9;
}

.data-table .name-cell {
  color: var(--navy);
  font-weight: 650;
}

/* Tên sản phẩm trong bảng chi tiết giảm độ đậm */
#productList .dynamic-month-table tbody .sticky-name {
  font-weight: 650 !important;
}

.data-table .rep-cell {
  color: #596875;
}

.data-table .money-cell {
  color: var(--navy);
  text-align: right;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}

.data-table .number-cell {
  text-align: center;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}

.row-open {
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--navy);
  font: inherit;
  font-weight: 650;
  text-align: left;
  overflow-wrap: anywhere;
  cursor: pointer;
}

.row-open:hover {
  color: #9B7738;
  text-decoration: underline;
}

#resultsWrap .data-table th:nth-child(1),
#resultsWrap .data-table td:nth-child(1) {
  width: 44%;
}

#resultsWrap .data-table th:nth-child(2),
#resultsWrap .data-table td:nth-child(2) {
  width: 22%;
}

#resultsWrap .data-table th:nth-child(3),
#resultsWrap .data-table td:nth-child(3) {
  width: 12%;
}

#resultsWrap .data-table th:nth-child(4),
#resultsWrap .data-table td:nth-child(4) {
  width: 22%;
}

/* =========================
   CHI TIẾT KHÁCH HÀNG
========================= */

.detail {
  border-top: 4px solid var(--gold);
  margin-top: 16px;
  padding: 16px;
  overflow: visible;
}

.detail-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin: -16px -16px 16px;
  padding: 16px;
  position: sticky;
  top: 0;
  z-index: 20;
  background: #FFFFFF;
  border-bottom: 1px solid var(--line);
}

.detail-head h2 {
  font-size: 20px;
  overflow-wrap: anywhere;
}

.detail-meta {
  margin-top: 7px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
}

.detail-total {
  margin-top: 10px;
  color: #9B7738;
  font-size: 15px;
  font-weight: 900;
}

#productList {
  width: 100%;
  min-width: 0;
}

/* =========================
   BẢNG CHI TIẾT THEO THÁNG
========================= */

#productList .detail-scroll {
  width: 100%;
  max-width: 100%;
  max-height: 65vh;
  overflow-x: auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 0;
  margin: 0;
}

#productList .dynamic-month-table {
  width: max-content;
  min-width: 100%;
  table-layout: auto;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 11px;
}

#productList .dynamic-month-table th,
#productList .dynamic-month-table td {
  padding: 5px 7px !important;
  line-height: 1.2 !important;
  white-space: nowrap;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

/* Tiêu đề các cột */
#productList .dynamic-month-table thead th {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--navy);
  color: #FFFFFF;
  font-weight: 800;
}

/* Cột tên sản phẩm cố định */
#productList .dynamic-month-table .sticky-name {
  position: sticky;
  left: 0;
  width: 180px;
  min-width: 180px;
  max-width: 180px;
  white-space: normal;
  overflow-wrap: anywhere;
  text-align: left;
  z-index: 3;
  background: #FFFFFF;
  box-shadow: 2px 0 3px rgba(20,43,69,.06);
}

/* Tiêu đề tên sản phẩm nằm trên cùng */
#productList .dynamic-month-table thead .sticky-name {
  z-index: 7;
  background: var(--navy);
  color: #FFFFFF;
}

/* Cột tổng cố định */
#productList .dynamic-month-table .sticky-total {
  position: sticky;
  left: 180px;
  width: 95px;
  min-width: 95px;
  max-width: 95px;
  z-index: 3;
  text-align: right;
  white-space: nowrap;
  background: var(--gold-pale);
  box-shadow: 2px 0 4px rgba(20,43,69,.08);
}

/* Tiêu đề cột tổng */
#productList .dynamic-month-table thead .sticky-total {
  z-index: 7;
  background: var(--navy);
  color: #FFFFFF;
}

/* Các cột tháng */
#productList .dynamic-month-table .month-col,
#productList .dynamic-month-table .month-value {
  width: 90px;
  min-width: 90px;
  max-width: 90px;
  text-align: right;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

/* Số liệu từng tháng KHÔNG in đậm */
#productList .dynamic-month-table tbody td.month-value {
  background: #FFFFFF;
  color: var(--ink);
  font-weight: 400 !important;
}

/* Màu nền xen kẽ của các tháng */
#productList .dynamic-month-table tbody tr:nth-child(even) td.month-value {
  background: var(--row-alt);
}

/* Ô bằng 0: ẩn số và tô nền xám */
#productList .dynamic-month-table tbody td.zero-month,
#productList .dynamic-month-table tbody tr:nth-child(even) td.zero-month,
#productList .dynamic-month-table tbody tr:hover td.zero-month {
  background: var(--gray-zero) !important;
  color: transparent !important;
  font-weight: 400 !important;
}

/* Khi di chuột, các ô có số thay đổi màu nền */
#productList .dynamic-month-table tbody tr:hover td:not(.zero-month) {
  background: #F3EBD9;
}

#productList .dynamic-month-table tbody tr:hover .sticky-name,
#productList .dynamic-month-table tbody tr:hover .sticky-total {
  background: #F3EBD9;
}

/* Tiêu đề tháng không bị in đậm quá mức */
#productList .dynamic-month-table thead .month-col {
  font-weight: 700;
}

/* =========================
   TRẠNG THÁI TRỐNG VÀ LỖI
========================= */

.empty {
  padding: 34px 18px;
  color: var(--muted);
  text-align: center;
  font-size: 13px;
  line-height: 1.8;
}

.empty strong {
  color: var(--navy);
}

.empty .btn {
  margin-top: 12px;
}

/* =========================
   ĐIỆN THOẠI
========================= */

@media (max-width: 640px) {
  .top {
    padding: 10px 8px 12px;
  }

  .top-inner {
    min-height: 0;
    padding: 13px 11px;
    gap: 7px;
    border-radius: 14px;
    /* Mobile: keep the brand readable on the left and reveal the Halloween artwork on the right. */
    background-image: none; /* Halloween artwork removed */
    background-size: auto, auto 100%;
    background-position: center, right center;
    background-repeat: no-repeat;
  }

  .top-inner .brand {
    display: flex;
    flex: 1 1 auto;
    position: relative;
    z-index: 2;
  }

  .top-inner .connection {
    align-self: center;
    margin-top: 0;
    position: relative;
    z-index: 2;
    background: rgba(9,27,47,.82);
  }

  .brand {
    gap: 9px;
  }

  .logo {
    width: 40px;
    height: 40px;
    padding: 3px;
    border-radius: 10px;
  }

  h1 {
    font-size: 17px;
    letter-spacing: -.2px;
  }

  .connection {
    gap: 5px;
    padding: 7px 8px;
    font-size: 9px;
  }

  .dot {
    width: 7px;
    height: 7px;
  }

  main {
    padding: 0 7px 28px;
  }

  .filters {
    padding: 10px 12px;
    margin-bottom: 8px;
    border-radius: 13px;
  }

  .section-head {
    margin-bottom: 8px;
  }

  .section-head h2 {
    font-size: 14px;
  }

  .btn {
    padding: 8px 10px;
    font-size: 10px;
  }

  .rep-scroll {
    gap: 6px;
    padding-bottom: 10px;
    margin-bottom: 5px;
  }

  .rep-chip {
    padding: 8px 11px;
    font-size: 10px;
  }

  .search-grid {
    grid-template-columns: minmax(0, 1fr);
    gap: 7px;
  }

  .field label {
    margin-bottom: 6px;
    font-size: 10px;
  }

  input {
    height: 41px;
    font-size: 16px !important;
    line-height: normal;
    padding-left: 38px;
    padding-right: 6px;
  }

  .results-head {
    padding: 12px 10px;
    gap: 7px;
  }

  .results-head h2 {
    font-size: 14px;
  }

  .count {
    padding: 7px 8px;
    font-size: 9px;
  }

  .table-wrap {
    padding: 4px;
    overflow-x: auto;
  }

  #resultsWrap > .table-wrap {
    padding: 4px;
    overflow: visible;
  }

  #resultsWrap > .table-wrap > .data-table thead th {
    top: 58px;
  }

  .data-table {
    font-size: 10px;
  }

  .data-table th {
    padding: 7px 4px;
    font-size: 9px;
    line-height: 1.3;
    overflow-wrap: anywhere;
    letter-spacing: 0;
  }

  .data-table td {
    padding: 7px 4px;
    font-size: 10px;
    line-height: 1.3;
  }

  #resultsWrap .data-table th:nth-child(1),
  #resultsWrap .data-table td:nth-child(1) {
    width: 43%;
  }

  #resultsWrap .data-table th:nth-child(2),
  #resultsWrap .data-table td:nth-child(2) {
    width: 22%;
  }

  #resultsWrap .data-table th:nth-child(3),
  #resultsWrap .data-table td:nth-child(3) {
    width: 12%;
  }

  #resultsWrap .data-table th:nth-child(4),
  #resultsWrap .data-table td:nth-child(4) {
    width: 23%;
  }

  .row-open {
    font-size: inherit;
    line-height: 1.35;
  }

  .detail {
    padding: 10px;
    margin-top: 10px;
    border-radius: 13px;
  }

  .detail-head {
    gap: 7px;
    margin: -10px -10px 12px;
    padding: 10px;
  }

  .detail-head h2 {
    font-size: 15px;
  }

  .detail-meta {
    font-size: 10px;
  }

  .detail-total {
    font-size: 12px;
  }

  #productList .dynamic-month-table {
    font-size: 9px;
  }

  #productList .dynamic-month-table th,
  #productList .dynamic-month-table td {
    padding: 4px 5px !important;
    line-height: 1.15 !important;
  }

  #productList .dynamic-month-table .sticky-name {
    width: 125px;
    min-width: 125px;
    max-width: 125px;
  }

  #productList .dynamic-month-table .sticky-total {
    left: 125px;
    width: 78px;
    min-width: 78px;
    max-width: 78px;
  }

  #productList .dynamic-month-table .month-col,
  #productList .dynamic-month-table .month-value {
    width: 75px;
    min-width: 75px;
    max-width: 75px;
  }

  .empty {
    padding: 25px 10px;
    font-size: 11px;
  }
}

@media (max-width: 360px) {
  .top-inner {
    padding: 11px 8px;
  }

  .logo {
    width: 35px;
    height: 35px;
  }

  h1 {
    font-size: 15px;
  }

  .connection {
    padding: 6px;
    font-size: 8px;
  }

  .results-head h2 {
    font-size: 12px;
  }

  .count {
    font-size: 8px;
  }

  #productList .dynamic-month-table .sticky-name {
    width: 110px;
    min-width: 110px;
    max-width: 110px;
  }

  #productList .dynamic-month-table .sticky-total {
    left: 110px;
    width: 72px;
    min-width: 72px;
    max-width: 72px;
  }

  #productList .dynamic-month-table .month-col,
  #productList .dynamic-month-table .month-value {
    width: 68px;
    min-width: 68px;
    max-width: 68px;
  }
}

/* Căn giữa tiêu đề các cột trong bảng */
.data-table thead th {
  text-align: center !important;
  vertical-align: middle !important;
}

/* Căn giữa tiêu đề bảng chi tiết sản phẩm */
.detail-table thead th {
  text-align: center !important;
  vertical-align: middle !important;
}  
  

/* Nút chụp ảnh và xuất Excel dạng icon nhỏ, nằm ngang cạnh tiêu đề */
.export-actions {
  display: inline-flex;
  align-items: center;
  justify-content: flex-start;
  gap: 5px;
  flex-wrap: nowrap;
  margin-left: 8px;
  flex: 0 0 auto;
}
.export-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  min-width: 30px;
  min-height: 30px;
  padding: 0;
  border: 1px solid var(--gold-light);
  border-radius: 8px;
  background: #fff;
  color: var(--navy);
  font-size: 15px;
  line-height: 1;
  font-weight: 500;
  white-space: nowrap;
}
.export-btn.primary {
  background: var(--navy);
  border-color: var(--navy);
  color: #fff;
}
.export-btn:hover { filter: brightness(.97); transform: translateY(-1px); }
.export-btn:disabled { opacity: .55; cursor: wait; transform: none; }
.results-head { flex-wrap: nowrap; justify-content: flex-start; }
.results-head h2 { flex: 0 1 auto; min-width: 0; }
.results-head .export-actions { order: 2; }
.results-head .count { margin-left: auto; order: 3; }
.detail-head { flex-wrap: nowrap; align-items: flex-start; }
.detail-head > div:first-child { min-width: 0; flex: 0 1 auto; }
.detail-head .export-actions { margin-left: 8px; }
@media (max-width: 640px) {
  .export-actions { width: auto; margin-left: 6px; gap: 4px; }
  .export-btn { flex: 0 0 28px; width: 28px; height: 28px; min-width: 28px; min-height: 28px; }
  .results-head { gap: 6px; padding: 12px; }
  .results-head h2 { font-size: 14px; }
  .results-head .count { padding: 5px 7px; font-size: 9px; }
  .detail-head { gap: 8px; padding: 12px; }
  .detail-head h2 { font-size: 16px; }
  .detail-head .export-actions { margin-left: 8px; }
}

.top { padding-top: 20px; }
.top-inner {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  min-height: 124px;
  padding: 22px 26px;
  border: 1px solid rgba(255,255,255,.78);
  border-radius: 26px;
  background:
    radial-gradient(ellipse at 92% 115%, rgba(255,149,0,.60), transparent 42%),
    radial-gradient(ellipse at 0% 0%, rgba(33,182,215,.78), transparent 58%),
    linear-gradient(115deg, rgba(7,85,109,.94), rgba(15,110,133,.80) 55%, rgba(25,89,105,.74));
  box-shadow: 0 18px 42px rgba(8,76,100,.20), inset 0 1px 0 rgba(255,255,255,.45);
  -webkit-backdrop-filter: blur(18px);
  backdrop-filter: blur(18px);
}
.top-inner::before,
.top-inner::after {
  content: "";
  position: absolute;
  pointer-events: none;
  z-index: -1;
  border-radius: 50%;
}
.top-inner::before {
  width: 280px; height: 280px;
  right: 7%; top: -205px;
  border: 1px solid rgba(255,255,255,.30);
  box-shadow: 0 0 0 18px rgba(255,255,255,.045), 0 0 0 38px rgba(255,255,255,.035);
}
.top-inner::after {
  width: 180px; height: 180px;
  right: -38px; bottom: -130px;
  background: rgba(255,196,92,.20);
  filter: blur(2px);
}
.brand, .top-inner .brand { position: relative; z-index: 1; align-items: center; gap: 14px; }
.logo {
  flex: 0 0 auto;
  width: 58px; height: 58px;
  object-fit: contain;
  padding: 5px;
  border-radius: 16px;
  background: rgba(255,255,255,.88);
  border: 1px solid rgba(255,255,255,.92);
  box-shadow: 0 5px 18px rgba(4,47,63,.18), inset 0 1px 0 rgba(255,255,255,.9);
}
h1 { color: #fff; text-shadow: 0 2px 14px rgba(3,42,57,.16); }
.connection, .top-inner .connection {
  position: relative; z-index: 1;
  color: #fff;
  background: rgba(255,255,255,.16);
  border: 1px solid rgba(255,255,255,.48);
  border-radius: 999px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.22);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
}

main { padding-bottom: 34px; }
.glass {
  background: linear-gradient(135deg, rgba(255,255,255,.70), rgba(255,255,255,.58));
  border: 1px solid rgba(255,255,255,.86);
  border-radius: 22px;
  box-shadow: 0 12px 34px rgba(8,76,100,.11), inset 0 1px 0 rgba(255,255,255,.94), inset 0 -1px 0 rgba(255,255,255,.24);
  -webkit-backdrop-filter: blur(20px) saturate(135%);
  backdrop-filter: blur(20px) saturate(135%);
}
.filters, .results, .detail { overflow: hidden; }
.filters { border-top: 3px solid rgba(255,149,0,.72); }
.section-head h2, .results-head h2, .detail-head h2 { color: #183047; }
.btn {
  color: #164158;
  background: rgba(255,255,255,.70);
  border: 1px solid rgba(255,255,255,.92);
  box-shadow: 0 4px 12px rgba(8,76,100,.08), inset 0 1px 0 rgba(255,255,255,.95);
  border-radius: 13px;
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
}
.btn:hover { background: rgba(255,255,255,.92); border-color: rgba(33,182,215,.42); }
.rep-chip {
  background: rgba(255,255,255,.52);
  border: 1px solid rgba(255,255,255,.90);
  color: #24465a;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.88);
}
.rep-chip.active {
  color: #fff;
  background: linear-gradient(135deg, #087E9B, #21B6D7);
  border-color: rgba(255,255,255,.70);
  box-shadow: 0 6px 16px rgba(8,126,155,.22), inset 0 1px 0 rgba(255,255,255,.22);
}
.input-wrap {
  background: rgba(255,255,255,.78);
  border: 1px solid rgba(255,255,255,.96);
  box-shadow: inset 0 1px 3px rgba(20,70,85,.045), 0 3px 10px rgba(8,76,100,.035);
}
.input-wrap:focus-within {
  border-color: rgba(33,182,215,.72);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.95), inset 0 0 0 1px rgba(33,182,215,.22), 0 0 12px rgba(33,182,215,.16);
}
.search-icon { color: #D18A16; }
.field label { color: #1c465b; }
.results, .detail { border-top: 3px solid rgba(255,149,0,.72); }
.results-head, .detail-head {
  background: rgba(255,255,255,.58);
  border-bottom: 1px solid rgba(255,255,255,.92);
  -webkit-backdrop-filter: blur(18px);
  backdrop-filter: blur(18px);
}
.count {
  color: #164158;
  background: rgba(255,196,92,.23);
  border: 1px solid rgba(255,149,0,.28);
  border-radius: 999px;
}
.export-btn {
  background: rgba(255,255,255,.76);
  border: 1px solid rgba(255,255,255,.96);
  box-shadow: 0 4px 12px rgba(8,76,100,.10), inset 0 1px 0 rgba(255,255,255,.96);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
}
.export-btn:hover { transform: translateY(-1px); box-shadow: 0 7px 16px rgba(8,76,100,.15); }
.export-btn.primary {
  color: white;
  background: linear-gradient(135deg, #087E9B, #21B6D7);
  border-color: rgba(255,255,255,.68);
}

/* Data tables remain opaque enough for clear reading. */
table { border-color: rgba(201,222,225,.95); }
thead th { background: linear-gradient(135deg, #07556D, #087E9B); color: #fff; }
td, th { border-color: rgba(205,222,224,.88); }
tbody tr:nth-child(even) { background: rgba(230,246,248,.82); }
tbody tr:nth-child(odd) { background: rgba(255,255,255,.84); }
tbody tr:hover { background: rgba(33,182,215,.12); }

@media (max-width: 640px) {
  .top { padding: 12px 10px 10px; }
  .top-inner {
    min-height: 94px;
    padding: 15px 13px;
    gap: 8px;
    border-radius: 20px;
    background:
      radial-gradient(ellipse at 100% 120%, rgba(255,149,0,.58), transparent 44%),
      radial-gradient(ellipse at 0% 0%, rgba(33,182,215,.80), transparent 64%),
      linear-gradient(115deg, rgba(7,85,109,.96), rgba(15,110,133,.86));
  }
  .brand, .top-inner .brand { gap: 9px; min-width: 0; }
  .logo { width: 43px; height: 43px; padding: 3px; border-radius: 12px; }
  h1 { font-size: clamp(13px, 4vw, 18px); line-height: 1.2; letter-spacing: -.25px; }
  .connection, .top-inner .connection { flex: 0 0 auto; padding: 7px 8px; font-size: 10px; gap: 5px; }
  .dot { width: 7px; height: 7px; }
  .glass { border-radius: 17px; background: rgba(255,255,255,.78); }
}
@media (max-width: 380px) {
  .top-inner { padding: 12px 10px; }
  .logo { width: 38px; height: 38px; }
  h1 { font-size: 12px; }
  .connection, .top-inner .connection { font-size: 9px; padding: 6px 7px; }
}

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
"use strict";

/* =====================================================
   1. KẾT NỐI GOOGLE APPS SCRIPT
===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbwWP7JLxEdO3qfZG850HZsoKB70fh4pUVrm3wsX4fPzAPCm1W2pcFrdVzZRrRvi8ycnNw/exec";

let rows = [];
let months = [];
let customers = [];
let selectedRep = "";
let selectedCustomer = null;

const $ = id => document.getElementById(id);

/* =====================================================
   2. HÀM XỬ LÝ DỮ LIỆU
===================================================== */

function norm(value) {
  return String(value ?? "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[đĐ]/g, "d")
    .toLowerCase()
    .trim();
}

function str(value) {
  return String(value ?? "").trim();
}

/* Bỏ tiền tố AD02 - ở đầu tên TDV */
function cleanRepName(value) {
  return str(value)
    .replace(/^AD02\s*-\s*/i, "")
    .trim();
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function num(value) {
  if (typeof value === "number") {
    return Number.isFinite(value) ? value : 0;
  }

  let s = String(value ?? "").trim();

  if (!s) return 0;

  s = s.replace(/[₫đ\s]/gi, "");

  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) {
    s = s.replace(/\./g, "").replace(",", ".");
  } else if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) {
    s = s.replace(/,/g, "");
  } else if (s.includes(",") && !s.includes(".")) {
    s = s.replace(",", ".");
  } else {
    s = s.replace(/,/g, "");
  }

  const result = Number(s);

  return Number.isFinite(result) ? result : 0;
}

function money(value) {
  return Math.round(Number(value) || 0)
    .toLocaleString("vi-VN");
}

/* =====================================================
   3. TRẠNG THÁI KẾT NỐI
===================================================== */

function setStatus(message, state = "") {
  $("status").textContent = message;
  $("dot").className = "dot" + (state ? " " + state : "");
}

/* =====================================================
   4. TẢI DỮ LIỆU BẰNG JSONP
===================================================== */

function loadJSONP() {
  return new Promise((resolve, reject) => {
    const callbackName =
      "__aikyaCallback_" +
      Date.now() + "_" +
      Math.random().toString(36).slice(2);

    const script = document.createElement("script");
    const separator = API_URL.includes("?") ? "&" : "?";

    let finished = false;
    let timer;

    function cleanup() {
      clearTimeout(timer);

      script.onerror = null;
      script.remove();

      try {
        delete window[callbackName];
      } catch (_) {
        window[callbackName] = undefined;
      }
    }

    function finish(error, result) {
      if (finished) return;

      finished = true;
      cleanup();

      if (error) {
        reject(error);
        return;
      }

      if (
        !result ||
        result.success !== true ||
        !Array.isArray(result.data)
      ) {
        reject(new Error(
          result?.error || "API không trả về dữ liệu hợp lệ."
        ));
        return;
      }

      resolve(result);
    }

    window[callbackName] = result => {
      finish(null, result);
    };

    script.onerror = () => {
      finish(new Error("Không tải được dữ liệu từ API."));
    };

    timer = setTimeout(() => {
      finish(new Error(
        "API phản hồi quá 20 giây. Vui lòng thử lại."
      ));
    }, 20000);

    script.src =
      API_URL +
      separator +
      "callback=" +
      encodeURIComponent(callbackName) +
      "&_=" +
      Date.now();

    document.head.appendChild(script);
  });
}

/* =====================================================
   5. KHỞI TẠO TRANG
===================================================== */

async function init() {
  setStatus("Đang tải");

  $("resultsCount").textContent = "Đang tải...";
  $("resultsWrap").innerHTML =
    '<div class="empty">Đang tải dữ liệu...</div>';

  try {
    const result = await loadJSONP();

    rows = result.data;

    const columns = Array.isArray(result.columns)
      ? result.columns
      : Object.keys(rows[0] || {});

    /* Nhận diện và sắp xếp cột tháng */
    months = columns
      .map(column => String(column).trim())
      .filter(column => /^\d{4}-T\d{2}$/i.test(column))
      .sort((a, b) => {
        const [yearA, monthA] = a.split("-T").map(Number);
        const [yearB, monthB] = b.split("-T").map(Number);

        return yearA - yearB || monthA - monthB;
      });

    aggregate();

    setStatus("Đã kết nối", "ok");

    render();

  } catch (error) {
    console.error("AIKYA API error:", error);

    setStatus("Lỗi kết nối", "error");
    $("resultsCount").textContent = "Lỗi";

    $("resultsWrap").innerHTML = `
      <div class="empty">
        <strong>Không tải được dữ liệu.</strong>
        <br>
        ${esc(error.message || error)}
        <br>
        <button type="button" class="btn" id="retryLoad">
          Thử tải lại
        </button>
      </div>
    `;

    $("retryLoad").addEventListener("click", init);
  }
}

/* =====================================================
   6. GỘP DỮ LIỆU KHÁCH HÀNG VÀ SẢN PHẨM
===================================================== */

function aggregate() {
  const customerMap = new Map();

  rows.forEach(row => {
    const customerName = str(row["KHACH HANG"]);
    const rep = cleanRepName(row["NVBH"]);
    const productName = str(row["SAN PHAM"]);

    if (!customerName || !productName) return;

    const customerKey =
      norm(customerName) + "||" + norm(rep);

    if (!customerMap.has(customerKey)) {
      customerMap.set(customerKey, {
        key: customerKey,
        customer: customerName,
        rep,
        total: 0,
        products: new Map()
      });
    }

    const customer = customerMap.get(customerKey);
    const productKey = norm(productName);

    if (!customer.products.has(productKey)) {
      customer.products.set(productKey, {
        name: productName,
        total: 0,
        months: {}
      });
    }

    const product = customer.products.get(productKey);
    const total = num(row["TONG"]);

    product.total += total;
    customer.total += total;

    months.forEach(month => {
      const amount = num(row[month]);

      product.months[month] =
        (product.months[month] || 0) + amount;
    });
  });

  customers = [...customerMap.values()].map(customer => {
    customer.products = [...customer.products.values()]
      .map(product => {
        const boughtMonths = months.filter(
          month => (product.months[month] || 0) > 0
        );

        const latest = boughtMonths.length
          ? boughtMonths[boughtMonths.length - 1]
          : "";

        return {
          ...product,
          monthCount: boughtMonths.length,
          latest,
          latestSales: latest
            ? product.months[latest]
            : 0
        };
      })
      .sort((a, b) => a.name.localeCompare(b.name, "vi"));

    return customer;
  });

  renderRepChips();
}

/* =====================================================
   7. HIỂN THỊ DANH SÁCH TDV
===================================================== */

function renderRepChips() {
  const reps = [...new Set(
    customers.map(customer => customer.rep).filter(Boolean)
  )].sort((a, b) => a.localeCompare(b, "vi"));

  const options = [
    { name: "Tất cả TDV", value: "" },
    ...reps.map(rep => ({
      name: rep,
      value: rep
    }))
  ];

  $("repChips").innerHTML = options.map(rep => `
    <button
      type="button"
      class="rep-chip ${selectedRep === rep.value ? "active" : ""}"
      data-rep="${esc(rep.value)}"
    >${esc(rep.name)}</button>
  `).join("");

  $("repChips").querySelectorAll("[data-rep]").forEach(button => {
    button.addEventListener("click", () => {
      selectedRep = button.dataset.rep;
      selectedCustomer = null;

      syncReps();
      render();
    });
  });
}

function syncReps() {
  $("repChips")
    .querySelectorAll("[data-rep]")
    .forEach(button => {
      button.classList.toggle(
        "active",
        button.dataset.rep === selectedRep
      );
    });
}

/* =====================================================
   8. LỌC DỮ LIỆU
===================================================== */

function filteredCustomers() {
  const customerQuery = norm($("customerSearch").value);
  const productQuery = norm($("productSearch").value);

  return customers.map(customer => {
    if (selectedRep && customer.rep !== selectedRep) {
      return null;
    }

    if (
      customerQuery &&
      !norm(customer.customer).includes(customerQuery)
    ) {
      return null;
    }

    const matchingProducts = productQuery
      ? customer.products.filter(product =>
          norm(product.name).includes(productQuery)
        )
      : customer.products;

    if (productQuery && matchingProducts.length === 0) {
      return null;
    }

    return {
      ...customer,
      visibleProducts: matchingProducts,
      visibleTotal: productQuery
        ? matchingProducts.reduce(
            (sum, product) => sum + product.total,
            0
          )
        : customer.total
    };
  }).filter(Boolean);
}

/* =====================================================
   9. HIỂN THỊ DANH SÁCH KHÁCH HÀNG
===================================================== */

function render() {
  if (selectedCustomer) {
    renderDetail(selectedCustomer);
    return;
  }

  $("resultsPanel").classList.remove("hidden");
  $("detailPanel").classList.add("hidden");

  const list = filteredCustomers();
  const productQuery = norm($("productSearch").value);
  const customerQuery = norm($("customerSearch").value);

  list.sort((a, b) => b.visibleTotal - a.visibleTotal);

  $("resultsTitle").textContent = productQuery
    ? "Khách hàng có sản phẩm phù hợp"
    : customerQuery
      ? "Kết quả tìm khách hàng"
      : "Danh sách khách hàng";

  $("resultsCount").textContent =
    list.length.toLocaleString("vi-VN") + " khách hàng";

  if (!list.length) {
    $("resultsWrap").innerHTML =
      '<div class="empty">Không tìm thấy kết quả phù hợp.</div>';
    return;
  }

  const body = list.map(customer => `
    <tr>
      <td class="name-cell">
        <button
          type="button"
          class="row-open"
          data-key="${esc(customer.key)}"
        >${esc(customer.customer)}</button>
      </td>

      <td class="rep-cell">
        ${esc(customer.rep || "—")}
      </td>

      <td class="number-cell">
        ${productQuery
          ? customer.visibleProducts.length
          : customer.products.length}
      </td>

      <td class="money-cell">
        ${money(customer.visibleTotal)}
      </td>
    </tr>
  `).join("");

  $("resultsWrap").innerHTML = `
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>KHÁCH HÀNG</th>
            <th>NVBH</th>
            <th>SL SKUs</th>
            <th style="text-align:right">TỔNG 2026</th>
          </tr>
        </thead>
        <tbody>${body}</tbody>
      </table>
    </div>
  `;

  $("resultsWrap")
    .querySelectorAll("[data-key]")
    .forEach(button => {
      button.addEventListener("click", () => {
        openDetail(button.dataset.key);
      });
    });
}

/* =====================================================
   10. MỞ CHI TIẾT KHÁCH HÀNG
===================================================== */

function openDetail(key) {
  selectedCustomer =
    customers.find(customer => customer.key === key) || null;

  if (!selectedCustomer) return;

  renderDetail(selectedCustomer);

  window.scrollTo({
    top:
      $("detailPanel").getBoundingClientRect().top +
      window.scrollY - 8,
    behavior: "smooth"
  });
}

/* =====================================================
   11. CHI TIẾT SẢN PHẨM THEO THÁNG
===================================================== */

function renderDetail(customer) {
  $("resultsPanel").classList.add("hidden");
  $("detailPanel").classList.remove("hidden");

  const productQuery = norm($("productSearch").value);

  const visibleProducts = (
    productQuery
      ? customer.products.filter(product =>
          norm(product.name).includes(productQuery)
        )
      : customer.products
  ).slice().sort((a, b) =>
    b.total - a.total ||
    a.name.localeCompare(b.name, "vi")
  );

  const visibleTotal = visibleProducts.reduce(
    (sum, product) => sum + product.total,
    0
  );

  $("detailTitle").textContent = customer.customer;

  $("detailMeta").textContent =
    "TDV: " + (customer.rep || "Chưa có") +
    " · " + visibleProducts.length + " sản phẩm";

  $("detailTotal").textContent =
    (productQuery
      ? "Doanh số sản phẩm khớp: "
      : "Doanh số tổng khách hàng: ") +
    money(productQuery ? visibleTotal : customer.total);

  if (!visibleProducts.length) {
    $("productList").innerHTML =
      '<div class="empty">Không tìm thấy sản phẩm phù hợp.</div>';
    return;
  }

  /* Tạo tiêu đề tháng từ dữ liệu API */
  const monthHeaders = months.map(month => `
    <th class="month-col">${esc(month)}</th>
  `).join("");

  /* Tạo các dòng sản phẩm */
  const body = visibleProducts.map(product => {
    const monthCells = months.map(month => {
      const amount = Number(product.months[month] || 0);
      const isZero = amount === 0;

      return `
        <td class="month-value${isZero ? " zero-month" : ""}">
          ${isZero ? "" : money(amount)}
        </td>
      `;
    }).join("");

    return `
      <tr>
        <td class="name-cell sticky-name">
          ${esc(product.name)}
        </td>

        <td class="total-value sticky-total">
          ${money(product.total)}
        </td>

        ${monthCells}
      </tr>
    `;
  }).join("");

  $("productList").innerHTML = `
    <div class="table-wrap detail-scroll">
      <table class="data-table detail-table dynamic-month-table">
        <thead>
          <tr>
            <th class="sticky-name">SẢN PHẨM</th>
            <th class="sticky-total">TỔNG 2026</th>
            ${monthHeaders}
          </tr>
        </thead>

        <tbody>${body}</tbody>
      </table>
    </div>
  `;
}


/* =====================================================
   12. CHỤP ẢNH / XUẤT EXCEL DỮ LIỆU ĐANG HIỂN THỊ
===================================================== */
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function fileStamp() {
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
}

function safeFileName(value) {
  return String(value || "AIKYA")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^\w\-]+/g, "_").replace(/^_+|_+$/g, "")
    .slice(0, 70) || "AIKYA";
}

function exportXlsx(rowsData, filename, sheetName) {
  if (!window.XLSX) {
    alert("Chưa tải được thư viện Excel. Hãy kiểm tra kết nối Internet rồi thử lại.");
    return;
  }
  if (!rowsData.length) {
    alert("Không có dữ liệu để xuất.");
    return;
  }
  const ws = XLSX.utils.json_to_sheet(rowsData);
  ws["!cols"] = Object.keys(rowsData[0]).map(key => ({
    wch: Math.min(36, Math.max(12, key.length + 3,
      ...rowsData.slice(0, 100).map(row => String(row[key] ?? "").length + 2)))
  }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, (sheetName || "Du lieu").slice(0, 31));
  XLSX.writeFile(wb, filename);
}

async function captureTable(tableSelector, filename, titleText, metaText = "") {
  if (!window.html2canvas) {
    alert("Chưa tải được thư viện chụp ảnh. Hãy kiểm tra kết nối Internet rồi thử lại.");
    return;
  }
  const sourceTable = document.querySelector(tableSelector);
  if (!sourceTable) {
    alert("Không có bảng dữ liệu để chụp.");
    return;
  }

  const button = document.activeElement;
  if (button && button.tagName === "BUTTON") {
    button.disabled = true;
  }

  try {
    // Dựng bản sao ngoài màn hình với chiều rộng đầy đủ để chụp cả bảng khi có cuộn ngang/dọc.
    const cloneWrap = document.createElement("div");
    cloneWrap.style.cssText = [
      "position:fixed", "left:-100000px", "top:0", "z-index:-1",
      "background:#fff", "padding:18px", "width:max-content",
      "max-width:none", "overflow:visible", "color:#263746",
      "font-family:Arial,sans-serif"
    ].join(";");
    const title = document.createElement("div");
    title.textContent = titleText || "AIKYA 2026";
    title.style.cssText = "font-size:18px;font-weight:700;margin-bottom:6px;color:#142B45";
    cloneWrap.appendChild(title);
    if (metaText) {
      const meta = document.createElement("div");
      meta.textContent = metaText;
      meta.style.cssText = "font-size:12px;margin-bottom:12px;color:#596875";
      cloneWrap.appendChild(meta);
    }
    const clone = sourceTable.cloneNode(true);
    clone.style.width = Math.max(sourceTable.scrollWidth, sourceTable.getBoundingClientRect().width) + "px";
    clone.style.maxWidth = "none";
    clone.style.overflow = "visible";
    clone.querySelectorAll("*").forEach(el => {
      el.style.position = "static";
      el.style.left = "auto";
      el.style.top = "auto";
      el.style.maxHeight = "none";
      el.style.maxWidth = "none";
      el.style.visibility = "visible";
      el.style.transform = "none";
    });
    cloneWrap.appendChild(clone);
    document.body.appendChild(cloneWrap);

    const canvas = await html2canvas(cloneWrap, {
      backgroundColor: "#FFFFFF",
      scale: Math.min(2, window.devicePixelRatio || 1.5),
      useCORS: true,
      logging: false,
      width: cloneWrap.scrollWidth,
      height: cloneWrap.scrollHeight,
      windowWidth: Math.max(document.documentElement.clientWidth, cloneWrap.scrollWidth),
      windowHeight: Math.max(window.innerHeight, cloneWrap.scrollHeight)
    });

    cloneWrap.remove();
    canvas.toBlob(blob => {
      if (!blob) {
        alert("Không tạo được ảnh. Bảng có thể quá lớn; hãy thử lại.");
        return;
      }
      downloadBlob(blob, filename);
    }, "image/png");
  } catch (error) {
    console.error("Capture table error:", error);
    alert("Chụp ảnh chưa thành công. Nếu bảng quá lớn, hãy lọc bớt dữ liệu rồi thử lại.");
  } finally {
    const temp = document.querySelector('body > div[style*="left:-100000px"]');
    if (temp) temp.remove();
    if (button && button.tagName === "BUTTON") button.disabled = false;
  }
}

function currentCustomerExportRows() {
  const productQuery = norm($("productSearch").value);
  const list = filteredCustomers().slice().sort((a, b) => b.visibleTotal - a.visibleTotal);
  return list.map(customer => ({
    "KHÁCH HÀNG": customer.customer,
    "NVBH": customer.rep || "",
    "SL SKUs": productQuery ? customer.visibleProducts.length : customer.products.length,
    "TỔNG 2026": Number(customer.visibleTotal || 0)
  }));
}

function currentDetailExportRows() {
  if (!selectedCustomer) return [];
  const productQuery = norm($("productSearch").value);
  const products = (productQuery
    ? selectedCustomer.products.filter(product => norm(product.name).includes(productQuery))
    : selectedCustomer.products
  ).slice().sort((a, b) => b.total - a.total || a.name.localeCompare(b.name, "vi"));

  return products.map(product => {
    const row = {
      "SẢN PHẨM": product.name,
      "TỔNG 2026": Number(product.total || 0)
    };
    months.forEach(month => {
      row[month] = Number(product.months[month] || 0);
    });
    return row;
  });
}

function detailExportMeta() {
  if (!selectedCustomer) return "";
  return `TDV: ${selectedCustomer.rep || "Chưa có"} · ${$("detailMeta").textContent} · ${$("detailTotal").textContent}`;
}

/* =====================================================
   12. ĐẶT LẠI BỘ LỌC
===================================================== */

function resetFilters() {
  selectedRep = "";
  selectedCustomer = null;

  $("customerSearch").value = "";
  $("productSearch").value = "";

  syncReps();
  render();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

/* =====================================================
   13. SỰ KIỆN GIAO DIỆN
===================================================== */

$("customerSearch").addEventListener("input", () => {
  selectedCustomer = null;
  render();
});

$("productSearch").addEventListener("input", () => {
  render();
});

$("reset").addEventListener("click", resetFilters);

$("back").addEventListener("click", () => {
  selectedCustomer = null;
  render();

  window.scrollTo({
    top:
      $("resultsPanel").getBoundingClientRect().top +
      window.scrollY - 8,
    behavior: "smooth"
  });
});


$("captureCustomers").addEventListener("click", () => {
  captureTable(
    "#resultsWrap .table-wrap",
    `Danh_sach_khach_hang_${fileStamp()}.png`,
    $("resultsTitle").textContent,
    `${$("resultsCount").textContent} · Bộ lọc TDV: ${selectedRep || "Tất cả"}`
  );
});

$("exportCustomers").addEventListener("click", () => {
  exportXlsx(
    currentCustomerExportRows(),
    `Danh_sach_khach_hang_${fileStamp()}.xlsx`,
    "Danh sach KH"
  );
});

$("captureDetail").addEventListener("click", () => {
  captureTable(
    "#productList .detail-scroll",
    `Chi_tiet_${safeFileName(selectedCustomer?.customer)}_${fileStamp()}.png`,
    `Chi tiết khách hàng: ${selectedCustomer?.customer || ""}`,
    detailExportMeta()
  );
});

$("exportDetail").addEventListener("click", () => {
  exportXlsx(
    currentDetailExportRows(),
    `Chi_tiet_${safeFileName(selectedCustomer?.customer)}_${fileStamp()}.xlsx`,
    "Chi tiet"
  );
});

/* =====================================================
   14. KHỞI CHẠY ỨNG DỤNG
===================================================== */

init();

</script>
