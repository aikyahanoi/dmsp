<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>KPI THÁNG - CHI NHÁNH HÀ NỘI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: "Inter", sans-serif;
  background: linear-gradient(135deg, #f1f4f9, #e3ecf5);
  margin: 0;
  padding: 12px;
  color: #263238;
}

.container {
  width: 100%;
  max-width: 1600px;
  margin: auto;
}

/* HEADER */
.header {
  background: linear-gradient(to right, #fff, #fff5f5);
  padding: 18px 12px;
  border-radius: 16px;
  border-bottom: 3px solid #d32f2f;
  box-shadow: 0 4px 12px rgba(0,0,0,.08);
  margin-bottom: 12px;
  text-align: center;
}

.title {
  font-size: 24px;
  line-height: 1.35;
  font-weight: 800;
  color: #d32f2f;
  margin-bottom: 12px;
}

/* KPI SUMMARY */
.stats-inline {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px 22px;
}

.stat-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: #546e7a;
}

.stat-item b {
  font-size: 16px;
  font-weight: 800;
  color: #d32f2f;
  font-variant-numeric: tabular-nums;
}

.stat-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.dot-clb { background: #7b1fa2; }
.dot-phu { background: #1976d2; }
.dot-checkin { background: #2e7d32; }

/* SEARCH */
.search-box {
  position: sticky;
  top: 0;
  z-index: 999;
  display: flex;
  justify-content: center;
  padding: 8px;
  margin-bottom: 12px;
  background: linear-gradient(to right, #fff, #fff5f5);
  border-radius: 14px;
  box-shadow: 0 4px 10px rgba(0,0,0,.08);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

#search {
  width: 100%;
  max-width: 600px;
  min-width: 0;
  padding: 11px 16px;
  border: 1px solid #ddd;
  border-radius: 25px;
  font-family: inherit;
  font-size: 14px;
  outline: none;
  background: #fff;
}

#search:focus {
  border-color: #d32f2f;
  box-shadow: 0 0 0 2px rgba(211,47,47,.12);
}

/* FILTER */
.filter-bar {
  display: flex;
  gap: 7px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.filter-btn {
  border: 1px solid transparent;
  background: #deeafc;
  color: #263238;
  padding: 8px 14px;
  border-radius: 18px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 2px 5px rgba(0,0,0,.07);
  flex-shrink: 0;
}

.filter-btn:hover,
.filter-btn.active {
  background: linear-gradient(135deg, #d32f2f, #ef5350);
  color: #fff;
}

/* TABLE */
.table-wrap {
  width: 100%;
  overflow-x: auto;
  background: rgba(255,255,255,.9);
  border-radius: 14px;
  box-shadow: 0 5px 18px rgba(0,0,0,.08);
}

table {
  width: 100%;
  min-width: 1050px;
  border-collapse: separate;
  border-spacing: 0;
  table-layout: auto;
  background: #fff;
  font-size: 13px;
}

thead th {
  position: sticky;
  top: 0;
  z-index: 5;
  background: linear-gradient(135deg, #c62828, #ef5350);
  color: #fff;
  padding: 12px 10px;
  text-align: center;
  font-weight: 700;
  white-space: nowrap;
  border-right: 1px solid rgba(255,255,255,.18);
}

thead th:first-child {
  border-top-left-radius: 10px;
}

thead th:last-child {
  border-top-right-radius: 10px;
  border-right: none;
}

tbody td {
  padding: 11px 10px;
  border-bottom: 1px solid #edf0f2;
  vertical-align: middle;
  line-height: 1.45;
  overflow-wrap: anywhere;
}

tbody tr:nth-child(even) {
  background: #fafbfc;
}

tbody tr:hover {
  background: #fff4e5;
}

/* COLUMN FORMATTING */
td.id-cell {
  text-align: center;
  color: #000;
  font-weight: 400;
}

td.customer-cell {
  min-width: 180px;
  font-weight: 700;
  color: #263238;
}

td.nvbh-cell {
  min-width: 130px;
  text-align: center;
  color: #000;
  font-weight: 400;
}

td.number-cell {
  text-align: center;
  color: #000;
  font-weight: 400;
}

td.clb-cell {
  text-align: center;
  font-weight: 400;
}

td.dophu-cell {
  text-align: right;
  color: #000;
  font-weight: 400;
}

td.checkin-cell {
  text-align: center;
}

/* KPI BADGES */
.kpi-value {
  display: inline-block;
  min-width: 48px;
  padding: 4px 8px;
  border-radius: 7px;
  background: transparent;
  color: #d32f2f;
  font-weight: 400;
}

.kpi-value.qualified {
  background: #e8f5e9;
  color: #2e7d32;
  font-weight: 800;
}

.coverage-value {
  color: #000;
  font-weight: 400;
}

.coverage-value.low {
  color: #d32f2f;
  font-weight: 400;
}

.checkin-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  padding: 4px 9px;
  border-radius: 7px;
  background: transparent;
  color: #000;
  font-weight: 400;
}

.checkin-badge.not-done {
  background: transparent;
  color: #000;
}

.loading,
.empty {
  text-align: center;
  padding: 25px 10px;
  color: #607d8b;
}

.error {
  color: #d32f2f;
}

/* MOBILE: HIỂN THỊ ĐỦ 8 CỘT */

    padding: 5px;
  }

  .container {
    width: 100%;
    min-width: 0;
  }

  .header {
    padding: 12px 5px;
    border-radius: 10px;
    margin-bottom: 8px;
  }

  .title {
    font-size: 17px;
    line-height: 1.3;
    margin-bottom: 10px;
  }

  .stats-inline {
    gap: 8px 12px;
  }

  .stat-item {
    gap: 4px;
    font-size: 10px;
  }

  .stat-item b {
    font-size: 13px;
  }

  .stat-dot {
    width: 6px;
    height: 6px;
  }

  .search-box {
    padding: 6px;
    margin-bottom: 8px;
    border-radius: 10px;
  }

  #search {
    padding: 9px 12px;
    font-size: 12px;
  }

  .filter-bar {
    justify-content: flex-start;
    flex-wrap: nowrap;
    overflow-x: auto;
    max-width: 100%;
    padding: 2px 1px 8px;
    margin-bottom: 7px;
    -webkit-overflow-scrolling: touch;
  }

  .filter-btn {
    padding: 7px 10px;
    font-size: 11px;
  }

  .table-wrap {
    overflow-x: hidden;
    border-radius: 8px;
    width: 100%;
  }

  table {
    width: 100%;
    min-width: 0;
    table-layout: fixed;
    font-size: 9px;
  }

  thead th:nth-child(1),
  tbody td:nth-child(1) { width: 6%; }

  thead th:nth-child(2),
  tbody td:nth-child(2) { width: 18%; }

  thead th:nth-child(3),
  tbody td:nth-child(3) { width: 12%; }

  thead th:nth-child(4),
  tbody td:nth-child(4) { width: 13%; }

  thead th:nth-child(5),
  tbody td:nth-child(5) { width: 10%; }

  thead th:nth-child(6),
  tbody td:nth-child(6) { width: 14%; }

  thead th:nth-child(7),
  tbody td:nth-child(7) { width: 14%; }

  thead th:nth-child(8),
  tbody td:nth-child(8) { width: 13%; }

  thead th {
    position: static;
    padding: 7px 2px;
    font-size: 8px;
    line-height: 1.25;
    white-space: normal;
    overflow-wrap: anywhere;
    word-break: normal;
  }

  tbody td {
    min-width: 0 !important;
    padding: 6px 2px;
    font-size: 9px;
    line-height: 1.3;
    white-space: normal !important;
    overflow-wrap: anywhere;
    word-break: normal;
  }

  td.id-cell {
    font-size: 8px;
  }

  td.customer-cell {
    font-weight: 600;
  }

  .kpi-value {
    display: inline-block;
    min-width: 0;
    max-width: 100%;
    padding: 3px 2px;
    border-radius: 4px;
    font-size: 8px;
    white-space: normal;
  }

  .coverage-value {
    font-size: 8px;
  }

  .checkin-badge {
    min-width: 0;
    max-width: 100%;
    padding: 3px 4px;
    border-radius: 4px;
    font-size: 8px;
  }

  .loading,
  .empty {
    padding: 20px 5px !important;
    font-size: 11px;
  }
}

/* ĐIỆN THOẠI MÀN HÌNH RẤT NHỎ */
@media (max-width: 380px) {
  body {
    padding: 3px;
  }

  .title {
    font-size: 15px;
  }

  .stat-item {
    font-size: 9px;
  }

  .stat-item b {
    font-size: 12px;
  }

  thead th {
    font-size: 8px;
    padding: 6px 1px;
  }

  tbody td {
    font-size: 8px;
    padding: 5px 1px;
  }

  .kpi-value,
  .coverage-value,
  .checkin-badge {

  }
}
</style>

<body>

<div class="container">

  <div class="header">

    <div class="title">
      KPI THÁNG - CHI NHÁNH HÀ NỘI
    </div>

    <div class="stats-inline">

      <div class="stat-item">
        <span class="stat-dot dot-clb"></span>
        <span>CLB:</span>
        <b id="statCLB">0</b>
      </div>

      <div class="stat-item">
        <span class="stat-dot dot-phu"></span>
        <span>Độ phủ:</span>
        <b id="statDoPhu">0</b>
      </div>

      <div class="stat-item">
        <span class="stat-dot dot-checkin"></span>
        <span>Check in:</span>
        <b id="statCheckIn">0</b>
      </div>

    </div>
  </div>

  <div class="search-box">
    <input
      id="search"
      type="text"
      placeholder="🔍 Tìm khách hàng, NVBH..."
      autocomplete="off"
    >
  </div>

  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active"
      onclick="filterNVBH('all', this)">
      Tất cả
    </button>
  </div>

  <div class="table-wrap">
    <table>

      <thead>
        <tr>
          <th>ID</th>
          <th>KHÁCH HÀNG</th>
          <th>NVBH</th>
          <th>MỨC KÝ HĐTL</th>
          <th>THỰC HIỆN</th>
          <th>% CLB THÁNG</th>
          <th>ĐỘ PHỦ</th>
          <th>CHECK IN</th>
        </tr>
      </thead>

      <tbody id="tableBody">
        <tr>
          <td colspan="8" class="loading">
            Đang tải dữ liệu...
          </td>
        </tr>
      </tbody>

    </table>
  </div>

</div>

<script>

/* =========================================
   CẤU HÌNH API
========================================= */

const API =
"https://script.google.com/macros/s/AKfycbzc0jHD7RE1E_XOhUQe1nG80H8f_SrsPWXR5AZlq5Wpt9ugk03MN5ZwGzZNX4IbDgNT/exec";

let list = [];
let currentFilter = "all";

/* =========================================
   CHUẨN HÓA TÊN CỘT
========================================= */

function normalize(str) {
  return String(str ?? "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/đ/g, "d")
    .replace(/[^a-z0-9]/g, "")
    .trim();
}

/* =========================================
   DANH SÁCH TÊN CỘT CÓ THỂ NHẬN DIỆN
========================================= */

const COLUMN_ALIASES = {

  "ID": [
    "ID",
    "STT",
    "MA KH"
  ],

  "KHACH HANG": [
    "KHACH HANG",
    "TEN KHACH HANG",
    "TEN KH",
    "CUSTOMER"
  ],

  "NVBH": [
    "NVBH",
    "NHAN VIEN BAN HANG",
    "TDV"
  ],

  "MUC KY HDTL": [
    "MUC KY HDTL",
    "MUC KY",
    "HDTL",
    "CHI TIEU",
    "TARGET"
  ],

  "THUC HIEN": [
    "THUC HIEN",
    "THỰC HIỆN",
    "THUC_HIEN",
    "THUCHIEN",
    "DOANH SO THUC HIEN",
    "DOANH THU THUC HIEN",
    "GIA TRI THUC HIEN",
    "ACTUAL",
    "ACTUAL SALES",
    "REALIZED"
  ],

  "% CLB THANG": [
    "% CLB THANG",
    "CLB THANG",
    "TY LE CLB THANG",
    "PHAN TRAM CLB THANG"
  ],

  "DO PHU": [
    "DO PHU",
    "ĐỘ PHỦ",
    "COVERAGE"
  ],

  "CHECK IN": [
    "CHECK IN",
    "CHECKIN",
    "CHECK_IN"
  ]
};

/* =========================================
   TÌM TÊN CỘT
========================================= */

function findKey(obj, keyword) {

  if (!obj || typeof obj !== "object") {
    return null;
  }

  const keys = Object.keys(obj);

  const target = normalize(keyword);

  const aliases =
    COLUMN_ALIASES[keyword] || [keyword];

  const normalizedAliases =
    [...new Set(
      aliases.map(alias => normalize(alias))
    )];

  /* Ưu tiên khớp chính xác tên cột */

  for (const alias of normalizedAliases) {

    const found = keys.find(key =>
      normalize(key) === alias
    );

    if (found !== undefined) {
      return found;
    }
  }

  /*
    Khớp tên cột có phần mở rộng.

    Ví dụ:
    THỰC HIỆN (VNĐ)
    THỰC HIỆN DOANH SỐ
  */

  for (const alias of normalizedAliases) {

    const found = keys.find(key => {

      const normalizedKey = normalize(key);

      return (
        normalizedKey.startsWith(alias) &&
        normalizedKey.length > alias.length
      );

    });

    if (found !== undefined) {
      return found;
    }
  }

  return null;
}

/* =========================================
   LẤY GIÁ TRỊ
========================================= */

function getValue(row, keyword) {

  const key = findKey(row, keyword);

  if (key === null) {
    return "";
  }

  const value = row[key];

  if (value === null || value === undefined) {
    return "";
  }

  return value;
}

/* =========================================
   CHỐNG LỖI HTML
========================================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

/* =========================================
   CHUYỂN DỮ LIỆU SANG SỐ
========================================= */

function parseNumber(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return NaN;
  }

  if (typeof value === "number") {
    return value;
  }

  let text = String(value).trim();

  text = text
    .replace(/\s/g, "")
    .replace(/[₫đ]/gi, "");

  /*
    Nhận diện số hàng nghìn:

    1.000
    1,000
    1.000.000
    1,000,000
  */

  if (/^-?\d{1,3}([.,]\d{3})+$/.test(text)) {

    text = text.replace(/[.,]/g, "");

  } else if (text.includes(".") && text.includes(",")) {

    const lastDot = text.lastIndexOf(".");
    const lastComma = text.lastIndexOf(",");

    if (lastComma > lastDot) {

      // 1.234,56
      text = text
        .replace(/\./g, "")
        .replace(",", ".");

    } else {

      // 1,234.56
      text = text.replace(/,/g, "");

    }

  } else {

    text = text.replace(",", ".");

  }

  const result = Number(text);

  return Number.isFinite(result)
    ? result
    : NaN;
}

/* =========================================
   ĐỊNH DẠNG SỐ
========================================= */

function formatNumericCell(value) {

  if (
    value === "" ||
    value === null ||
    value === undefined
  ) {
    return "";
  }

  const num = parseNumber(value);

  if (!Number.isFinite(num)) {
    return escapeHTML(value);
  }

  return num.toLocaleString("vi-VN", {
    maximumFractionDigits: 2
  });
}

/* =========================================
   XỬ LÝ PHẦN TRĂM
========================================= */

function parsePercent(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return NaN;
  }

  const text = String(value);

  const hasPercent = text.includes("%");

  const num = parseNumber(
    text.replace(/%/g, "")
  );

  if (!Number.isFinite(num)) {
    return NaN;
  }

  if (hasPercent) {
    return num;
  }

  if (num >= 0 && num <= 1) {
    return num * 100;
  }

  return num;
}

function formatPercent(value) {

  if (
    value === "" ||
    value === null ||
    value === undefined
  ) {
    return "";
  }

  const num = parsePercent(value);

  if (!Number.isFinite(num)) {
    return escapeHTML(value);
  }

  const formatted = num.toLocaleString("vi-VN", {
    maximumFractionDigits: 2
  });

  return formatted + "%";
}

/* =========================================
   CHECK IN
========================================= */

function isCheckedIn(value) {
  return String(value ?? "").trim() === "1";
}

/* =========================================
   KIỂM TRA DỮ LIỆU API
========================================= */

function inspectAPI(data) {

  console.log("===== KIỂM TRA API KPI =====");

  console.log("Tổng số dòng:", data.length);

  if (!data.length) {
    return;
  }

  const firstRow = data[0];

  console.log(
    "Danh sách tên cột:",
    Object.keys(firstRow)
  );

  const actualKey = findKey(
    firstRow,
    "THUC HIEN"
  );

  console.log(
    "Tên cột THỰC HIỆN:",
    actualKey
  );

  console.log(
    "Giá trị THỰC HIỆN dòng đầu:",
    getValue(firstRow, "THUC HIEN")
  );

  if (actualKey === null) {

    console.warn(
      "KHÔNG TÌM THẤY CỘT THỰC HIỆN TRONG API"
    );

  } else {

    console.log(
      "ĐÃ NHẬN DIỆN CỘT THỰC HIỆN"
    );

  }

  console.log("============================");
}

/* =========================================
   TẢI DỮ LIỆU
========================================= */

async function loadData() {

  const tbody =
    document.getElementById("tableBody");

  try {

    const response = await fetch(API, {
      method: "GET",
      redirect: "follow",
      cache: "no-store"
    });

    if (!response.ok) {

      throw new Error(
        "API trả về HTTP " + response.status
      );

    }

    const data = await response.json();

    if (!Array.isArray(data)) {

      throw new Error(
        "API không trả về danh sách dữ liệu"
      );

    }

    list = data.filter(row =>
      row &&
      typeof row === "object" &&
      !Array.isArray(row)
    );

    inspectAPI(list);

    createFilters();

    applyFilters();

  } catch (error) {

    console.error(
      "Lỗi tải dữ liệu KPI:",
      error
    );

    tbody.innerHTML = `
      <tr>
        <td colspan="8" class="empty error">
          Không tải được dữ liệu KPI.
          Vui lòng kiểm tra kết nối và API.
        </td>
      </tr>
    `;

  }
}

/* =========================================
   TÍNH KPI THEO DỮ LIỆU ĐANG HIỂN THỊ
========================================= */

function updateStats(filteredData) {

  let clb = 0;
  let doPhu = 0;
  let checkIn = 0;

  filteredData.forEach(row => {

    /* CLB đạt từ 100% */

    const clbPercent = parsePercent(
      getValue(row, "% CLB THANG")
    );

    if (
      Number.isFinite(clbPercent) &&
      clbPercent >= 100
    ) {
      clb++;
    }

    /* Độ phủ đạt từ 500 */

    const coverage = parseNumber(
      getValue(row, "DO PHU")
    );

    if (
      Number.isFinite(coverage) &&
      coverage >= 500
    ) {
      doPhu++;
    }

    /* Check in bằng 1 */

    if (
      isCheckedIn(
        getValue(row, "CHECK IN")
      )
    ) {
      checkIn++;
    }

  });

  document.getElementById(
    "statCLB"
  ).textContent = clb;

  document.getElementById(
    "statDoPhu"
  ).textContent = doPhu;

  document.getElementById(
    "statCheckIn"
  ).textContent = checkIn;
}

/* =========================================
   TẠO NÚT LỌC NVBH
========================================= */

function createFilters() {

  const filterBar =
    document.getElementById("filterBar");

  filterBar.innerHTML = "";

  const allButton =
    document.createElement("button");

  allButton.className =
    "filter-btn active";

  allButton.textContent =
    "Tất cả";

  allButton.onclick = function() {

    filterNVBH("all", this);

  };

  filterBar.appendChild(allButton);

  const names = new Set();

  list.forEach(row => {

    const name = String(
      getValue(row, "NVBH")
    ).trim();

    if (name !== "") {
      names.add(name);
    }

  });

  Array.from(names)
    .sort((a, b) =>
      a.localeCompare(b, "vi")
    )
    .forEach(name => {

      const button =
