<!DOCTYPE html>
<html lang="vi">
<head>

<title>KPI THÁNG 10 - CHI NHÁNH HÀ NỘI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: "Inter", sans-serif;
  background: linear-gradient(135deg, #f1f4f9, #e3ecf5);
  margin: 0;
  padding: 12px;
  color: #263238;
}

.container {
  width: 100%;
  max-width: 1600px;
  margin: auto;
}

/* HEADER */
.header {
  background: linear-gradient(to right, #fff, #fff5f5);
  padding: 18px 12px;
  border-radius: 16px;
  border-bottom: 3px solid #d32f2f;
  box-shadow: 0 4px 12px rgba(0,0,0,.08);

  text-align: center;
}

.title {
  font-size: 24px;

  font-weight: 800;
  color: #d32f2f;
  margin-bottom: 16px;
}

/* KPI SUMMARY - CĂN GIỮA CẢ NHÓM */
.stats-inline {
  display: grid;
  grid-template-columns: repeat(4, max-content);
  justify-content: center;
  align-items: center;
  gap: 12px 24px;
  width: 100%;
  margin: 0 auto;
}

.stat-item {
  display: inline-flex;
  align-items: center;
  justify-content: flex-start;
  gap: 6px;
  font-size: 13px;
  color: #546e7a;
  white-space: nowrap;
  min-width: 0;
}

.stat-item b {
  font-size: 16px;
  font-weight: 800;
  color: #d32f2f;
  font-variant-numeric: tabular-nums;
}

.stat-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.dot-clb {
  background: #7b1fa2;
}

.dot-phu {
  background: #1976d2;
}

.dot-checkin {
  background: #2e7d32;
}

.dot-doanhso {
  background: #1976d2;
}

/* SEARCH */
.search-box {
  position: sticky;
  top: 0;
  z-index: 999;
  display: flex;
  justify-content: center;
  padding: 8px;
  margin-bottom: 12px;
  background: linear-gradient(to right, #fff, #fff5f5);
  border-radius: 14px;
  box-shadow: 0 4px 10px rgba(0,0,0,.08);

}

#search {
  width: 100%;
  max-width: 600px;
  min-width: 0;
  padding: 11px 16px;
  border: 1px solid #ddd;
  border-radius: 25px;
  font-family: inherit;

  background: #fff;
}

#search:focus {
  border-color: #d32f2f;

/* FILTER */
.filter-bar {
  display: flex;
  gap: 7px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.filter-btn {
  border: 1px solid transparent;
  background: #deeafc;

}

.filter-btn:hover,

/* TABLE */
.table-wrap {
  width: 100%;
  overflow-x: auto;
  background: rgba(255,255,255,.9);

table {

thead th {

thead th:first-child {

tbody tr:nth-child(even) {

/* ĐIỆN THOẠI MÀN HÌNH RẤT NHỎ */

tbody td,

/* ĐIỆN THOẠI */

<body>
<div class="container">

  <div class="header">

    <div class="title">
      KPI THÁNG 10 - CHI NHÁNH HÀ NỘI
    </div>

    <div class="stats-inline">

      <!-- DOANH SỐ -->
      <div class="stat-item">
        <span class="stat-dot dot-doanhso"></span>
        <span>Doanh số:</span>
        <b id="statDoanhSo">0</b>
      </div>

      <!-- CLB -->
      <div class="stat-item">
        <span class="stat-dot dot-clb"></span>
        <span>CLB:</span>
        <b id="statCLB">0</b>
      </div>

      <!-- ĐỘ PHỦ -->
      <div class="stat-item">
        <span class="stat-dot dot-phu"></span>
        <span>Độ phủ:</span>
        <b id="statDoPhu">0</b>
      </div>

      <!-- CHECK IN -->
      <div class="stat-item">
        <span class="stat-dot dot-checkin"></span>
        <span>Check in:</span>
        <b id="statCheckIn">0</b>
      </div>

    </div>
  </div>

  <div class="search-box">
    <input
      id="search"
      type="text"
      placeholder="🔍 Tìm khách hàng, NVBH..."
      autocomplete="off"
    >
  </div>

  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" onclick="filterTEN('all', this)">
      Tất cả
    </button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>KHÁCH HÀNG</th>
          <th>NVBH</th>
          <th>MỨC KÝ HĐTL</th>
          <th>THỰC HIỆN</th>
          <th>% CLB THÁNG</th>
          <th>ĐỘ PHỦ</th>
          <th>CHECK IN</th>
        </tr>
      </thead>

      <tbody id="tableBody">
        <tr>
          <td colspan="8" class="loading">Đang tải dữ liệu...</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<script>
const API =
"https://script.google.com/macros/s/AKfycbzc0jHD7RE1E_XOhUQe1nG80H8f_SrsPWXR5AZlq5Wpt9ugk03MN5ZwGzZNX4IbDgNT/exec";

let list = [];
let currentFilter = "all";

/* CHUẨN HÓA TÊN CỘT VÀ TỪ KHÓA */
function normalize(str) {
  return String(str ?? "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/đ/g, "d")
    .replace(/\s+/g, "")
    .trim();
}

function findKey(obj, keyword) {
  if (!obj) return null;

  const target = normalize(keyword);

  return Object.keys(obj).find(key =>
    normalize(key) === target
  ) || null;
}

/* ĐỌC GIÁ TRỊ, HỖ TRỢ THU HIEN / THUC HIEN */
function getValue(row, keyword) {
  if (!row) return "";

  const normalizedKeyword = normalize(keyword);

  if (
    normalizedKeyword === "thuchien" ||
    normalizedKeyword === "thuhien"
  ) {
    const actualKey = Object.keys(row).find(key => {
      const normalizedKey = normalize(key);

      return normalizedKey === "thuhien" ||
             normalizedKey === "thuchien";
    });

    return actualKey ? (row[actualKey] ?? "") : "";
  }

  const key = findKey(row, keyword);

  return key ? (row[key] ?? "") : "";
}

/* CHUYỂN KÝ TỰ ĐẶC BIỆT THÀNH HTML AN TOÀN */
function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

/* CHUYỂN DỮ LIỆU SANG SỐ */
function parseNumber(value) {
  if (value === null || value === undefined || value === "") {
    return NaN;
  }

  if (typeof value === "number") {
    return value;
  }

  let text = String(value).trim();

  text = text.replace(/\s/g, "").replace(/₫/g, "");

  if (text === "") return NaN;

  if (/^-?\d{1,3}([.,]\d{3})+$/.test(text)) {
    text = text.replace(/[.,]/g, "");
  } else {
    text = text.replace(",", ".");
  }

  return Number(text);
}

/* CHUYỂN GIÁ TRỊ PHẦN TRĂM */
function parsePercent(value) {
  if (value === null || value === undefined || value === "") {
    return NaN;
  }

  const hasPercent = String(value).includes("%");

  const num = parseNumber(
    String(value).replace(/%/g, "")
  );

  if (!Number.isFinite(num)) return NaN;

  if (hasPercent) return num;

  if (num >= 0 && num <= 1) return num * 100;

  return num;
}

function formatPercent(value) {
  if (value === "" || value === null || value === undefined) {
    return "";
  }

  const num = parsePercent(value);

  if (!Number.isFinite(num)) {
    return escapeHTML(value);
  }

  return Number.isInteger(num)
    ? num + "%"
    : num.toLocaleString("vi-VN", {
        maximumFractionDigits: 2
      }) + "%";
}

function formatNumericCell(value) {
  const num = parseNumber(value);

  if (!Number.isFinite(num)) {
    return escapeHTML(value);
  }

  return num.toLocaleString("vi-VN", {
    maximumFractionDigits: 2
  });
}

function isCheckedIn(value) {
  return parseNumber(value) === 1;
}

/* TẢI DỮ LIỆU */
async function loadData() {
  const tbody = document.getElementById("tableBody");

  try {
    const response = await fetch(API);

    if (!response.ok) {
      throw new Error("API trả về HTTP " + response.status);
    }

    const data = await response.json();

    if (!Array.isArray(data)) {
      throw new Error("Dữ liệu API không phải một danh sách");
    }

    list = data;

    console.log("DỮ LIỆU KPI:", list);
    console.log(
      "CÁC CỘT:",
      list.length ? Object.keys(list[0]) : []
    );

    /* KIỂM TRA CỘT TEN */
    if (list.length && findKey(list[0], "TEN") === null) {
      throw new Error(
        'Không tìm thấy cột "TEN" trong dữ liệu API. ' +
        'Hãy kiểm tra tên cột trong Google Sheets và dữ liệu API.'
      );
    }

    createFilters();
    applyFilters();

  } catch (error) {
    console.error("Lỗi tải KPI:", error);

    tbody.innerHTML = `
      <tr>
        <td colspan="8" class="empty error">
          Không tải được dữ liệu KPI.
          Vui lòng kiểm tra URL API, kết nối và tên cột TEN trong Google Sheet.
        </td>
      </tr>
    `;
  }
}

/* TÍNH KPI THEO DỮ LIỆU ĐANG HIỂN THỊ */
function updateStats(filteredData) {
  let clb = 0;
  let doPhu = 0;
  let checkIn = 0;
  let doanhSo = 0;

  filteredData.forEach(row => {
    /* ĐẾM CLB ĐẠT TỪ 100% */
    const clbPercent = parsePercent(
      getValue(row, "% CLB THANG")
    );

    if (Number.isFinite(clbPercent) && clbPercent >= 100) {
      clb++;
    }

    /* ĐỘ PHỦ VÀ DOANH SỐ */
    const coverage = parseNumber(
      getValue(row, "DO PHU")
    );

    if (Number.isFinite(coverage)) {
      if (coverage >= 500) {
        doPhu++;
      }

      /* DOANH SỐ = TỔNG CỘT ĐỘ PHỦ */
      doanhSo += coverage;
    }

    /* ĐẾM CHECK IN = 1 */
    if (isCheckedIn(getValue(row, "CHECK IN"))) {
      checkIn++;
    }
  });

  document.getElementById("statCLB").textContent = clb;
  document.getElementById("statDoPhu").textContent = doPhu;
  document.getElementById("statCheckIn").textContent = checkIn;

  document.getElementById("statDoanhSo").textContent =
    doanhSo.toLocaleString("vi-VN", {
      maximumFractionDigits: 2
    });
}

/* TẠO NÚT LỌC THEO CỘT TEN */
function createFilters() {
  const filterBar = document.getElementById("filterBar");

  filterBar.innerHTML = "";

  const allButton = document.createElement("button");

  allButton.className = "filter-btn active";
  allButton.textContent = "Tất cả";

  allButton.onclick = function() {
    filterTEN("all", this);
  };

  filterBar.appendChild(allButton);

  const names = new Set();

  list.forEach(row => {
    const name = String(getValue(row, "TEN")).trim();

    if (name !== "") {
      names.add(name);
    }
  });

  Array.from(names)
    .sort((a, b) => a.localeCompare(b, "vi"))
    .forEach(name => {
      const button = document.createElement("button");

      button.className = "filter-btn";
      button.textContent = name;

      button.onclick = function() {
        filterTEN(name, this);
      };

      filterBar.appendChild(button);
    });
}

/* LỌC THEO CỘT TEN */
function filterTEN(name, button) {
  currentFilter = name;

  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.classList.remove("active");
  });

  if (button) {
    button.classList.add("active");
  }

  applyFilters();
}

/* TÌM KIẾM */
document.getElementById("search")
  .addEventListener("input", applyFilters);

/* LỌC, TÌM KIẾM VÀ SẮP XẾP ĐỘ PHỦ GIẢM DẦN */
function applyFilters() {
  const keyword = normalize(
    document.getElementById("search").value
  );

  const filtered = list.filter(row => {

    /* LỌC THEO GIÁ TRỊ CỘT TEN */
    if (currentFilter !== "all") {
      const name = String(getValue(row, "TEN")).trim();

      if (name !== currentFilter) {
        return false;
      }
    }

    /* TÌM KIẾM TRÊN CÁC TRƯỜNG DỮ LIỆU */
    if (keyword !== "") {
      const searchable = [
        getValue(row, "ID"),
        getValue(row, "KHACH HANG"),
        getValue(row, "TEN"),
        getValue(row, "NVBH"),
        getValue(row, "MUC KY HDTL"),
        getValue(row, "THU HIEN"),
        getValue(row, "% CLB THANG"),
        getValue(row, "DO PHU"),
        getValue(row, "CHECK IN")
      ].map(value => normalize(value)).join(" ");

      if (!searchable.includes(keyword)) {
        return false;
      }
    }

    return true;
  });

  /* SẮP XẾP ĐỘ PHỦ TỪ CAO XUỐNG THẤP */
  filtered.sort((a, b) => {
    const doPhuA = parseNumber(getValue(a, "DO PHU"));
    const doPhuB = parseNumber(getValue(b, "DO PHU"));

    const validA = Number.isFinite(doPhuA);
    const validB = Number.isFinite(doPhuB);

    if (validA && !validB) return -1;
    if (!validA && validB) return 1;

    if (!validA && !validB) return 0;

    return doPhuB - doPhuA;
  });

  updateStats(filtered);
  render(filtered);
}

/* HIỂN THỊ BẢNG */
function render(data) {
  const tbody = document.getElementById("tableBody");

  if (!data.length) {
    tbody.innerHTML = `
      <tr>
        <td colspan="8" class="empty">
          Không có dữ liệu phù hợp.
        </td>
      </tr>
    `;
    return;
  }

  tbody.innerHTML = data.map(row => {
    const id = getValue(row, "ID");
    const customer = getValue(row, "KHACH HANG");

    /* TIÊU ĐỀ NVBH NHƯNG HIỂN THỊ DỮ LIỆU CỘT TEN */
    const nvbh = getValue(row, "TEN");

    const contract = getValue(row, "MUC KY HDTL");
    const actual = getValue(row, "THU HIEN");
    const clb = getValue(row, "% CLB THANG");
    const coverage = getValue(row, "DO PHU");
    const checkIn = getValue(row, "CHECK IN");

    const clbPercent = parsePercent(clb);

    const isCLBQualified =
      Number.isFinite(clbPercent) && clbPercent >= 100;

    const isCLBLow =
      Number.isFinite(clbPercent) && clbPercent < 100;

    const coverageNumber = parseNumber(coverage);

    const isCoverageLow =
      Number.isFinite(coverageNumber) &&
      coverageNumber > 0 &&
      coverageNumber < 500;

    const contractNumber = parseNumber(contract);

    const hasNumericContract =
      String(contract ?? "").trim() !== "" &&
      Number.isFinite(contractNumber);

    const checkInDone = isCheckedIn(checkIn);

    return `
      <tr>
        <td class="id-cell">
          ${escapeHTML(id)}
        </td>

        <td class="customer-cell">
          ${escapeHTML(customer)}
        </td>

        <td class="nvbh-cell">
          ${escapeHTML(nvbh)}
        </td>

        <td class="number-cell contract-cell ${
          hasNumericContract ? "contract-number-cell" : ""
        }">
          ${formatNumericCell(contract)}
        </td>

        <td class="number-cell actual-cell">
          ${formatNumericCell(actual)}
        </td>

        <td class="clb-cell clb-month-cell">
          <span class="kpi-value ${
            isCLBQualified ? "qualified" : ""
          }" style="${
            isCLBLow
              ? "color:#d32f2f;"
              : (!isCLBQualified
                  ? "background:transparent;color:inherit;"
                  : "")
          }">
            ${formatPercent(clb)}
          </span>
        </td>

        <td class="dophu-cell">
          <span class="coverage-value ${
            isCoverageLow ? "low" : ""
          }" style="${
            !isCoverageLow
              ? "background:transparent;color:inherit;"
              : ""
          }">
            ${formatNumericCell(coverage)}
          </span>
        </td>

        <td class="checkin-cell">
          ${
            String(checkIn ?? "").trim() !== ""
              ? `<span class="checkin-badge ${
                  checkInDone ? "checkin-done" : "not-done"
                }">${escapeHTML(checkIn)}</span>`
              : ""
          }
        </td>
      </tr>
    `;
  }).join("");
}

/* KHỞI CHẠY */
loadData();
</script>
